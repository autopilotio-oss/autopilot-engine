name: Post to Threads
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: autopilot-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publish due posts
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/run_queue.py
      - name: Save what was posted
        run: |
          git config user.name "autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "posted" && git push)
