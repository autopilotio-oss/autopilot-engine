name: Outbound sales line video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/outbound_video/script.json", "tools/outbound_video/engine.html", "tools/outbound_video/build.py", "tools/outbound_video/mix.py", "tools/outbound_video/rend.js", ".github/workflows/outbound_video.yml"]
permissions:
  contents: write
concurrency: outbound_video
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - name: Voice + build + mix
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: bash tools/outbound_video/make.sh prep
      - uses: actions/upload-artifact@v4
        with: { name: prep, path: "tools/outbound_video/hq.html\ntools/outbound_video/hq_mix.wav\ntools/outbound_video/hq.words.json\ntools/outbound_video/hq.meta.json" }
  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: { k: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: prep, path: tools/outbound_video }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm i -g --silent playwright@1 && npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Render chunk
        run: RANGE=${{ matrix.k }}/8 bash tools/outbound_video/make.sh chunk
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.k }}", path: "tools/outbound_video/chunk_${{ matrix.k }}.mp4" }
  final:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: prep, path: tools/outbound_video }
      - uses: actions/download-artifact@v4
        with: { pattern: "chunk-*", path: tools/outbound_video, merge-multiple: true }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash tools/outbound_video/make.sh final
      - name: Commit
        run: |
          cp tools/outbound_video/hq.words.json tools/outbound_video/outbound.words.json
          git config user.name "autopilotio-oss"; git config user.email "autopilotio-oss@users.noreply.github.com"
          git add docs/media/outbound tools/outbound_video/outbound.words.json
          git diff --cached --quiet && exit 0
          git commit -m "Outbound sales line video"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 6; done
