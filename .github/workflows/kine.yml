name: Kinetic cuts (full screen motion graphics edit of factory reels)
on:
  workflow_dispatch:
    inputs:
      eps: { description: "Episode stems in tools/freel/eps (space separated). Uses the saved voice, no voice spend.", required: true }
permissions:
  contents: write
concurrency: kine
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
          npm i -g --silent playwright@1 && npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Render
        run: for E in ${{ github.event.inputs.eps }}; do bash tools/kine/make.sh "$E" 4; done
      - name: Commit
        run: |
          git config user.name "autopilotio-oss"; git config user.email "autopilotio-oss@users.noreply.github.com"
          git add docs/media/kine
          git diff --cached --quiet && exit 0
          git commit -m "Kinetic cuts rendered: ${{ github.event.inputs.eps }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 6; done
