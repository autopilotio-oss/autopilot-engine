name: Daily market story
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopilot-post
  cancel-in-progress: false
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow numpy && (which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg))
      - name: Build today's market story
        run: python scripts/market_story.py
      - name: Save it
        run: |
          git config user.name "autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/media/stories queue
          git diff --cached --quiet || (git commit -m "market story" && git pull --rebase && git push)
