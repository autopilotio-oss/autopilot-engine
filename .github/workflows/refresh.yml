name: Keep the Threads key alive
on:
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token (needs GH_PAT secret to save it)
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$THREADS_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then echo "refresh failed"; exit 1; fi
          if [ -n "$GH_TOKEN" ]; then gh secret set THREADS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"; echo "saved"; else echo "No GH_PAT: refreshed key not saved. Claude will remind you."; fi
