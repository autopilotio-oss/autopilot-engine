name: HQ ecosystem video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/hq/script.json", "tools/hq/engine.html", "tools/hq/build.py", "tools/hq/mix.py", ".github/workflows/hq.yml"]
permissions:
  contents: write
concurrency: hq
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy
          npm i -g --silent playwright@1 && npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: bash tools/hq/make.sh
      - name: Commit
        run: |
          git config user.name "autopilotio-oss"; git config user.email "autopilotio-oss@users.noreply.github.com"
          git add docs/media/hq tools/hq/hq.words.json
          git diff --cached --quiet && exit 0
          git commit -m "HQ ecosystem video"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 6; done
