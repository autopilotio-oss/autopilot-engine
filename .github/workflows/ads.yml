name: Ads (voiced kinetic ads over Seedance plates)
on:
  workflow_dispatch:
    inputs:
      eps: { description: "Ad stems in tools/kine/ads (space separated). Each one is one ElevenLabs voice render.", required: true }
permissions:
  contents: write
concurrency: ads
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { eps: "${{ steps.p.outputs.eps }}" }
    steps:
      - id: p
        run: python3 -c "import json;print('eps='+json.dumps('${{ github.event.inputs.eps }}'.split()))" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix: { ep: "${{ fromJson(needs.plan.outputs.eps) }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
          npm i -g --silent playwright@1 && npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Voice + render
        env: { ELEVENLABS_API_KEY: "${{ secrets.ELEVENLABS_API_KEY }}" }
        run: bash tools/kine/make_ad.sh "${{ matrix.ep }}" 4
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "ad-${{ matrix.ep }}", path: "docs/media/ads/${{ matrix.ep }}*\ntools/kine/out/${{ matrix.ep }}.wav\ntools/kine/out/${{ matrix.ep }}.words.json\ntools/kine/out/${{ matrix.ep }}_music.wav" }
  commit:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "ad-*", path: /tmp/ads, merge-multiple: true }
      - name: Commit
        run: |
          mkdir -p docs/media/ads tools/kine/voice; ls -R /tmp/ads
          find /tmp/ads -name '*.mp4' -exec cp {} docs/media/ads/ \; ; find /tmp/ads -name '*.jpg' -exec cp {} docs/media/ads/ \;
          find /tmp/ads -name '*.wav' -exec cp {} tools/kine/voice/ \; ; find /tmp/ads -name '*.words.json' -exec cp {} tools/kine/voice/ \;
          git config user.name "autopilotio-oss"; git config user.email "autopilotio-oss@users.noreply.github.com"
          git add docs/media/ads tools/kine/voice; git diff --cached --quiet && exit 0
          git commit -m "Ads rendered: ${{ github.event.inputs.eps }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 6; done
