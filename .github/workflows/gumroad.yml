name: Gumroad products
# run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["products/**", ".github/workflows/gumroad.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and publish products
        env: { GUMROAD_TOKEN: "${{ secrets.GUMROAD_TOKEN }}", KIT_PRIVATE_KEY: "${{ secrets.KIT_PRIVATE_KEY }}" }
        run: python3 scripts/gumroad_sync.py
      - name: Save
        run: |
          git config user.name "autopilot-bot"; git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true; git add state || true
          git diff --cached --quiet || (git commit -m "gumroad products" && git push)
