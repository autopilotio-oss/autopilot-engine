name: Check Instagram
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Who is connected
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "scripts"); import instagram
          t = instagram.get_token()
          if not t: print("::error title=Missing::Add the IG_TOKEN secret"); sys.exit(1)
          uid = instagram.user_id(t)
          info = instagram._req("GET", f"/{uid}", {"fields": "username"}, t)
          print(f"::notice title=Instagram connected::{info}")
          PY
