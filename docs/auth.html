<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTOPILOT.OI · Connect</title>
<style>body{margin:0;background:#0A0A0A;color:#F4F4F0;font:16px/1.5 -apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
.c{max-width:520px;width:100%}h1{font-size:28px;margin:0 0 8px}p{color:#A8A8A0}
textarea{width:100%;box-sizing:border-box;background:#141414;color:#D4FF3A;border:1px solid #2A2A2A;border-radius:14px;padding:16px;font:14px ui-monospace,monospace;height:140px}
button{margin-top:14px;width:100%;padding:18px;border:0;border-radius:14px;background:#D4FF3A;color:#0A0A0A;font-weight:700;font-size:18px}</style><link rel="stylesheet" href="/assets/brand.css"></head>
<body><div class="c"><h1 id="h">Your connect code</h1><p id="s">Tap Copy, then paste it into the Connect Threads run on GitHub. It works once and expires in 1 hour.</p>
<textarea id="t" readonly></textarea><button id="b">Copy</button></div>
<script>
var q=new URLSearchParams(location.search),c=(q.get('code')||'').replace(/#_$/,'');
var t=document.getElementById('t');t.value=c;
if(!c){document.getElementById('h').textContent='No code found';document.getElementById('s').textContent=q.get('error_description')||'Start again from the connect link.';}
document.getElementById('b').onclick=function(){t.select();try{navigator.clipboard.writeText(c)}catch(e){document.execCommand('copy')}this.textContent='Copied';};
</script></body></html>
