<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(/docs/assets/fonts/APText-Medium.woff)}
@font-face{font-family:TS;src:url(/docs/assets/fonts/APText-SemiBold.woff)}
@font-face{font-family:TB;src:url(/docs/assets/fonts/APText-Bold.woff)}
@font-face{font-family:A;src:url(/docs/assets/fonts/Anton-Regular.ttf)}
@font-face{font-family:M;src:url(/tools/office/fonts/JetBrainsMono.ttf)}
:root{--L:#D4FF3A;--K:#050505;--W:#f4f3ee;--G:#8f8f88}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:var(--K);color:var(--W);font-family:T}
.pg{position:absolute;inset:0}
.ph{position:absolute;left:0;top:0;width:1080px;height:1446px;object-fit:cover;object-position:50% 0}
.fade{position:absolute;left:0;right:0;top:600px;height:750px;background:linear-gradient(180deg,rgba(5,5,5,0) 0%,rgba(5,5,5,.6) 26%,rgba(5,5,5,.95) 42%,#050505 50%)}
.top{position:absolute;left:64px;right:64px;top:58px;display:flex;justify-content:space-between;align-items:center;font-family:M;font-size:22px;letter-spacing:.5px}
.cnt{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.chip{background:var(--L);color:#000;font-family:M;font-weight:700;font-size:20px;padding:9px 14px 8px;border-radius:6px;letter-spacing:1px}
.txt{position:absolute;left:64px;right:64px;bottom:150px}
.hook{font-family:TB;font-size:72px;line-height:1.05;letter-spacing:-.025em}
.cta{font-family:TB;font-size:50px;color:var(--L);margin-top:24px;letter-spacing:-.02em}
.bot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;justify-content:space-between;font-family:M;font-size:20px;color:#b0b0b0;letter-spacing:.5px}
.bot b{color:#fff;font-weight:700}
.lab{font-family:M;font-size:22px;color:var(--G);letter-spacing:.5px}
.card{border:2px solid #2a2a27;border-radius:22px;padding:44px 46px;background:#0d0d0c}
.pr{font-family:T;font-size:40px;line-height:1.38;color:#e9e8e2}
.pr .b{color:#000;background:var(--L);padding:0 .12em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.h2{font-family:A;font-size:104px;line-height:.98;text-transform:uppercase;letter-spacing:.3px}
.thumbs{display:flex;gap:18px}
.thumbs div{flex:1;height:440px;border-radius:16px;background-size:auto 175%;background-position:50% 4%;filter:blur(9px) brightness(.8);transform:scale(1)}
.thumbs{overflow:hidden;border-radius:16px}
</style></head><body><div id="root"></div>
<script>
const q=new URLSearchParams(location.search),P=+(q.get('p')||1),N=+(q.get('n')||1),T=3;
const POSTS={
 1:{hook:"This grandpa doesn’t exist. Nano Banana made him with one prompt.",
    prompt:"Candid direct flash photo shot on a 35mm film camera at night: a [75 year old man with a gray beard] dressed like a rapper, [oversized black puffer jacket, three iced out chains, diamond grills], smiling at the camera, sitting in a plastic lawn chair in a [suburban driveway], harsh on camera flash, film grain, realistic skin texture, vertical 4:5, no text, no logos",
    next:[2,4,9]},
 2:{hook:"Brands pay thousands for a photoshoot. This one is one prompt.",
    prompt:"Candid direct flash photo shot on a 35mm film camera: an [80 year old grandma with curled white hair and a cardigan] [DJing at a packed warehouse rave], big headphones on, hands on the decks, green lasers and haze, crowd hands in the air, harsh on camera flash, film grain, realistic skin texture, vertical 4:5, no text, no logos",
    next:[4,9,1]},
 3:{hook:"None of these people are real. Not even the nun.",
    prompt:"Candid direct flash photo shot on a 35mm film camera at night: a [nun in a full black and white habit] [landing a kickflip at a concrete skate park], chain link fence and street lights behind, harsh on camera flash, slight motion blur, film grain, vertical 4:5, no text, no logos",
    next:[7,4,10]},
 4:{hook:"AI photos just got too real. Here’s the prompt.",
    prompt:"Candid direct flash photo shot on a 35mm film camera at night: a [serious businessman in a full navy suit and tie] [covered head to toe in pink car wash foam, holding the foam brush], standing in a self serve car wash bay next to a black sedan, harsh on camera flash, film grain, vertical 4:5, no text, no logos",
    next:[9,1,3]},
 5:{hook:"Nano Banana can now fake a photo this real. One prompt.",prompt:"x",next:[1,2,3]},
 8:{hook:"AI just made photography weird. Here’s the prompt.",prompt:"x",next:[1,2,3]},
 15:{hook:"Grandma just won the hot dog contest. None of this is real.",prompt:"x",next:[1,2,3]},
 16:{hook:"Just a normal Tuesday. Except none of it is real.",prompt:"x",next:[1,2,3]},
 17:{hook:"This photo isn’t real. Your feed won’t tell you that.",prompt:"x",next:[1,2,3]},
 18:{sy:360,hook:"Thanksgiving photos are about to get weird. One prompt.",prompt:"x",next:[1,2,3]},
 19:{hook:"Nobody in this photo exists. Not even the alligator.",prompt:"x",next:[1,2,3]},
 20:{hook:"No wedding photographer took this. AI did.",prompt:"x",next:[1,2,3]},
 21:{hook:"The most real fake photo we’ve made yet. One prompt.",prompt:"x",next:[1,2,3]},
 22:{sy:140,hook:"Zero cameras were used for this. One prompt.",prompt:"x",next:[1,2,3]},
 23:{hook:"Grandma had a night. None of it happened.",prompt:"x",next:[1,2,3]},
 24:{hook:"You’re going to zoom in to check. It’s not real.",prompt:"x",next:[1,2,3]},
 25:{hook:"Traffic, but make it AI. One prompt.",prompt:"x",next:[1,2,3]},
 26:{hook:"She’s winning. She also doesn’t exist.",prompt:"x",next:[1,2,3]},
 27:{sy:230,hook:"This priest doesn’t exist. The photo looks 100% real.",prompt:"x",next:[1,2,3]},
 7:{hook:"This photo isn’t real. Neither are the grandmas.",
    prompt:"Candid direct flash photo shot on a 35mm film camera: a [huge tanned bodybuilder in a tight tank top] [knitting a pink scarf], sitting in a [circle of smiling grandmas in a cozy living room] with floral couches and doilies, harsh on camera flash, film grain, realistic skin texture, vertical 4:5, no text, no logos",
    next:[10,3,2]},
 9:{hook:"This sushi chef doesn’t exist. One prompt made him.",
    prompt:"Candid direct flash photo shot on a 35mm film camera: a [rugged cowboy with a hat, beard and leather vest] working as a [sushi chef behind a wooden sushi bar], carefully slicing salmon, customers watching, warm restaurant light, harsh on camera flash, film grain, vertical 4:5, no text, no logos",
    next:[10,3,7]},
 10:{hook:"Your new employee. Made with one prompt.",
    prompt:"Candid direct flash photo shot on a 35mm film camera: a [golden retriever wearing a white shirt, suit jacket and tie] [sitting in an office chair typing on a laptop] in a glass office at night, coffee mug next to him, city lights behind, harsh on camera flash, film grain, vertical 4:5, no text, no logos",
    next:[1,9,4]},
};
const PR={"1": "Candid 35mm film snapshot at night, harsh direct on camera flash, warm grainy late 90s family photo look: a [75 year old man with a gray beard and a huge laugh] dressed like a rapper in an [oversized black puffer jacket, three thick iced out chains and full diamond grills], leaning back in a white plastic lawn chair in a [suburban driveway], porch light glowing on the garage door behind him. Real skin texture, imperfect framing, no text, no logos, vertical 4:5", "2": "Candid 35mm film snapshot, direct flash mixed with club lights: an [80 year old grandma with curled white hair and a knit cardigan] [DJing at a packed underground warehouse rave], one hand on the mixer, headphones pressed to one ear, focused face. Green laser beams and haze above, sweaty crowd with hands in the air behind her. Grainy, slightly blown highlights, unbranded DJ gear, no text, no logos, vertical 4:5", "3": "Candid 35mm flash photo at night: a [nun in a full black and white habit and black sneakers] [popping a kickflip off the lip of a concrete skate bowl], board mid flip, slight motion blur, one bright flood light flaring behind her, chain link fence and an [industrial silo] in the background. Harsh flash, film grain, real, no text, no logos, vertical 4:5", "7": "Candid 35mm flash photo with warm lamp light: a [huge tanned bodybuilder in a black tank top] grinning while he [knits a pink scarf with long needles], surrounded by [five laughing grandmas in knit sweaters on floral couches], crocheted doilies, framed family photos and a brass lamp behind them. Late 90s family photo look, film grain, no text, no logos, vertical 4:5", "10": "Candid 35mm flash photo in a glass corner office at night: a [golden retriever in a navy suit, white shirt and red patterned tie] [sitting upright in a mesh office chair, typing on a laptop with one paw], coffee mug and desk phone beside him, [city lights blurred through the windows]. Deadpan, real, film grain, no text, no logos, vertical 4:5", "15": "Candid 35mm flash photo at a county fair at dusk, string lights overhead: a [tiny 85 year old grandma in a floral blouse and big glasses] standing triumphant at a [hot dog eating contest table], ketchup on her face, a half eaten bun in each hand, staring into the camera, while [two huge sweaty men in tank tops have collapsed face down beside her]. Crowd behind a barrier, carnival lights, grainy, no text, no logos, vertical 4:5", "16": "Candid 35mm flash photo in a cramped 90s kitchen at breakfast: a [chestnut pony standing at the kitchen table eating cereal from a bowl] while [a man in a bathrobe reads the newspaper] and [a woman in striped pajamas pours coffee], both completely unbothered. Fridge covered in kids’ drawings and magnets, hoof marks on the tile floor, red eye flash, film grain, no text, no logos, vertical 4:5", "17": "Candid 35mm photo shot through a car windshield at night at a red light: a [full grown black and white dairy cow] standing in the open trunk of a [silver minivan], seatbelt across its chest, a [young man in a flannel leaning out beside it giving a thumbs up]. Red brake lights, wet road reflections, street light flare, grainy, no text, no logos, vertical 4:5", "18": "Candid 35mm flash photo of a 90s family Thanksgiving in a wood paneled dining room: a [giant tortoise] seated in a wooden chair at the table with a checkered napkin tied around its shell, [eating mashed potatoes off a plate] while grandma ladles gravy and [relatives pass dishes around it like it’s normal]. Paper turkey decorations hanging, red eye flash, film grain, no text, no logos, vertical 4:5", "19": "Candid 35mm flash photo in a fluorescent lit grocery aisle: a [stern 80 year old man in a black tuxedo and bow tie] pushing a shopping cart with a [live alligator lying across the top of it], mouth open. Two shoppers behind him cover their mouths in shock, a dropped carton of eggs on the floor. Deadpan stare at the camera, film grain, unbranded shelves, no text, no logos, vertical 4:5", "20": "Candid 35mm flash photo from the back of a small church: the [aisle is under knee deep brown floodwater], an [elderly priest kneels in a metal canoe reading from a book], the bride and groom stand calmly at the altar and [guests stand in the pews holding their shoes], all staring at the camera. Petals and a bouquet floating, stained glass, red eye flash, film grain, no text, no logos, vertical 4:5", "21": "Candid flash photo at dawn on a quiet suburban street: a [huge rusty cargo ship bow sitting in a family’s driveway], towering over the houses, while [a couple in bathrobes holding coffee mugs] stares up at it and a [shirtless neighbor casually hoses down the driveway]. Overcast blue light, wet asphalt, minivan parked nearby, deadpan and real, film grain, no text, no logos, vertical 4:5", "22": "Candid 35mm flash photo at dusk during a flood: a [middle aged dad in sunglasses and a meat print apron] sitting in a lawn chair on the roof of his flooded house, [grilling burgers on a kettle grill], beer raised, thumbs up, while [two firefighters in a rescue boat below stare up in disbelief]. Brown floodwater, smoke rising, cooler floating nearby, film grain, no text, no logos, vertical 4:5", "23": "Candid 35mm flash photo at night: a [smiling 80 year old woman in a hospital gown and a sparkly plastic tiara] sitting on the hood of a police car in handcuffs, [holding a slice of pizza] with the open box beside her, while [two officers behind her facepalm]. Red and blue lights glowing, wet street, orange film date stamp in the corner, grainy, no logos, vertical 4:5", "24": "Candid 35mm flash photo inside a red booth diner at night: a [giraffe’s head and neck poking down through a broken ceiling tile] to [eat a pancake off a plate a customer holds up], ceiling debris on the floor, a waitress pouring coffee like nothing is happening, [a family in a booth staring up]. Neon diner sign in the rainy window, red eye flash, film grain, no logos, vertical 4:5", "25": "Candid photo through a rainy windshield on a jammed highway at night: a [man in a fluffy bathrobe] sitting in a [white bathtub full of bubbles in the middle of the lane], raising a glass of red wine, rubber duck on the rim, deadpan stare, while a [truck driver leans out his window yelling]. Traffic cones, brake lights, flash glare, grainy, no text, no logos, vertical 4:5", "26": "Candid 35mm flash photo in an old school gym: a [sweet 85 year old grandma in a floral blouse] calmly [winning an arm wrestling match against a huge sweating bodybuilder] who is straining in agony, while a [crowd of young gym goers behind them grab their heads in shock]. Folding table, barbells on the floor, orange film date stamp, red eye flash, grainy, no logos, vertical 4:5"};
for(const k in PR){POSTS[k]=POSTS[k]||{hook:'',next:[16,24,19]};POSTS[k].prompt=PR[k];if(POSTS[k].next[0]==1&&k>14)POSTS[k].next=[16,24,19]}
const p=POSTS[P],img=n=>`/docs/media/hub/week1/${String(n).padStart(2,'0')}.jpg`;
const cnt=`0${N}/0${T}`;
const tp=()=>N==1?`<div class="top"><span class="cnt">${cnt}</span><span class="chip">NANO BANANA</span></div>`:`<div class="top" style="top:44px"><span style="width:96px;height:96px;border-radius:18px;background:url(/docs/media/hub/ap_badge.png) center/cover;transform:rotate(-6deg);display:block"></span><span class="chip">NANO BANANA</span></div>`;
const bot=r=>`<div class="bot"><b>@autopilot.oi</b><span>${r}</span></div>`;
const br=t=>t.replace(/\[(.*?)\]/g,'<span class="b">$1</span>');
let h='';
if(N==1) h=`<div class="pg"><img class="ph" style="top:${-(p.sy||0)}px" src="${img(P)}"><div class="fade"></div>${tp()}
 <div class="txt"><div class="hook">${p.hook}</div><div class="cta">Steal the prompt →</div></div>${bot('SWIPE →')}</div>`;
else if(N==2) h=`<div class="pg" style="padding:58px 64px">${tp()}
 <div style="position:absolute;left:64px;right:64px;top:176px;bottom:140px;display:flex;flex-direction:column">
  <div class="h2">the prompt</div>
  <div class="lab" style="margin:26px 0 30px">paste into nano banana · swap the <span style="color:var(--L)">lime</span> parts for your own clash</div>
  <div class="card"><div class="pr">${br(p.prompt)}</div></div>
  <div style="margin-top:auto;display:flex;gap:16px">${['open nano banana','paste the prompt','swap the lime parts'].map((t,i)=>`<div style="flex:1;border-top:3px solid var(--L);padding-top:18px"><div class="lab" style="color:var(--L)">0${i+1}</div><div style="font-family:TS;font-size:30px;margin-top:8px;line-height:1.15">${t}</div></div>`).join('')}</div>
 </div>${bot('save it →')}</div>`;
else h=`<div class="pg">${tp()}
 <div style="position:absolute;left:64px;right:64px;top:176px;bottom:140px;display:flex;flex-direction:column;justify-content:space-between">
  <div><div class="h2">save this.<br><span style="color:var(--L)">you’ll want it later.</span></div>
  </div><div><div class="lab" style="margin:0 0 22px">coming next on @autopilot.oi · no peeking</div>
  <div class="thumbs">${p.next.map(n=>`<div style="background-image:url(${img(n)})"></div>`).join('')}</div>
  </div><div style="font-family:TS;font-size:52px;line-height:1.22">follow for a new prompt every day.<br><span style="color:#e9e8e2">free. no fluff.</span></div>
 </div>${bot('')}</div>`;
document.getElementById('root').innerHTML=h;
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>0))]).then(()=>{
 const bg=[...document.querySelectorAll('.thumbs div')];
 Promise.all(bg.map(d=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=d.style.backgroundImage.slice(5,-2)}))).then(()=>window.READY=1)});
</script></body></html>
