<!doctype html><html><head><meta charset=utf-8><style>*{margin:0}html,body{width:3240px;height:4050px;overflow:hidden}</style></head><body><canvas id=c width=3240 height=4050></canvas><script>
const gl=document.getElementById('c').getContext('webgl',{preserveDrawingBuffer:true});
const B=JSON.parse(decodeURIComponent(location.hash.slice(1)));const N=B.length;
const fs=`precision highp float;uniform vec2 R;uniform sampler2D T;uniform vec3 B[${N}];
float F(vec2 p){float f=0.;for(int i=0;i<${N};i++){vec2 d=p-B[i].xy;f+=B[i].z*B[i].z/(dot(d,d)+1.);}return f;}
vec3 tex(vec2 p){return texture2D(T,clamp(p/R,0.,1.)).rgb;}
void main(){vec2 p=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);
 float best=-1.;vec3 nn=vec3(0.);float rr=1.;
 float shadow=0.;float caus=0.;
 for(int i=0;i<${N};i++){vec2 d=p-B[i].xy;float r=B[i].z;float L=length(d);
   if(L<r){float z=sqrt(r*r-L*L)/r;if(z>best){best=z;nn=vec3(d/r,z);rr=r;}}
   vec2 ds=p-(B[i].xy+vec2(r*.18,r*.34));float Ls=length(ds);shadow=max(shadow,smoothstep(r*1.05,r*.6,Ls));
   caus=max(caus,smoothstep(r*.55,r*.05,length(p-(B[i].xy+vec2(r*.32,r*.5)))));}
 if(best<0.){vec3 bc=tex(p);bc*=1.-.5*shadow;bc+=vec3(.83,1.,.23)*caus*.55;gl_FragColor=vec4(bc,1.);return;}
 float z=nn.z;vec2 off=-nn.xy*rr*(.33+.25*(1.-z));
 vec2 c=p+off;float ca=rr*.012*(1.-z);
 vec3 col=vec3(tex(c+nn.xy*ca).r,tex(c).g,tex(c-nn.xy*ca).b);
 col=mix(col,col*vec3(.9,1.,.7),.15);
 float fres=pow(1.-z,3.);
 col=mix(col,vec3(.02),fres*.35);col+=vec3(.83,1.,.23)*fres*.25;
 vec3 l=normalize(vec3(-.5,-.6,.65));float spec=pow(max(dot(reflect(vec3(0,0,-1),nn),l),0.),60.);
 col+=vec3(1.)*spec*1.4;
 col+=vec3(1.)*smoothstep(.03,0.,abs(length(nn.xy-vec2(-.45,-.5))-.18))*.0;
 float rim=smoothstep(.14,.0,z);col=mix(col,vec3(.9,1.,.75),rim*.75);
 gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const img=new Image();img.onload=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);['TEXTURE_MIN_FILTER','TEXTURE_MAG_FILTER'].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,gl[k],gl.LINEAR));
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.uniform2f(gl.getUniformLocation(pr,'R'),3240,4050);gl.uniform3fv(gl.getUniformLocation(pr,'B'),new Float32Array(B.flat()));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();window.READY=1;};
img.src='/tmp_poster.png';
</script></body></html>
