<!doctype html><html><head><meta charset=utf-8><link rel="stylesheet" href="/tools/carousel/style.css"><style>body{margin:0;width:3240px;height:4050px;position:relative;overflow:hidden;background:#030403}canvas{position:absolute;left:0;top:0}.t{position:absolute;width:1080px;height:1350px}</style></head><body>
<canvas id=c width=3240 height=4050></canvas><div id=o></div><script>
const H=[["Texts at midnight?","Handled.","THE STORE"],["Texts that get","you paid.","SCRIPTS"],["Still doing","the books?","OWNER TOOLS"],["Gone after one","fake interview.","AI NEWS"],["Prompts for more","5 star reviews.","PROMPTS"],["A quiet quote","is a maybe.","THE STORE"],["Prompts that should","be illegal.","PROMPTS"],["Prompts that feel","like cheating.","CONTRACTORS"],["Type review.","Thank everyone.","THE STORE"]];
const x=document.getElementById('c').getContext('2d');let S=7;const R=()=>{S=(S*16807)%2147483647;return S/2147483647};
const L='212,255,58';
function strand(pts,w,a,col){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;x.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}const e=pts[pts.length-1];x.lineTo(e[0],e[1]);x.lineWidth=w;x.strokeStyle=`rgba(${col},${a})`;x.stroke()}
function path(a,b,c1,c2,n,j){const p=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;const px=u*u*u*a[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*b[0],py=u*u*u*a[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*b[1];const env=Math.sin(Math.PI*t);p.push([px+(R()-.5)*j*env,py+(R()-.5)*j*env])}return p}
function branch(px,py,ang,len,w,d){if(d<=0||len<8)return;const ex=px+Math.cos(ang)*len,ey=py+Math.sin(ang)*len;strand([[px,py],[(px+ex)/2+(R()-.5)*len*.3,(py+ey)/2+(R()-.5)*len*.3],[ex,ey]],w,.55,L);
 if(R()<.35){x.beginPath();x.arc(ex,ey,w*1.4,0,7);x.fillStyle=`rgba(255,255,240,.9)`;x.fill()}
 branch(ex,ey,ang+(R()-.5)*1.1-.35,len*.72,w*.7,d-1);branch(ex,ey,ang+(R()-.5)*1.1+.35,len*.68,w*.7,d-1)}
x.globalCompositeOperation='lighter';
for(let i=0;i<9;i++){const ox=(i%3)*1080,oy=Math.floor(i/3)*1350;S=1000+i*977;
 x.save();x.beginPath();x.rect(ox,oy,1080,1350);x.clip();
 // tissue cells
 for(let k=0;k<70;k++){const cx=ox+R()*1080,cy=oy+R()*1350,r=20+R()*70;const g=x.createRadialGradient(cx,cy,r*.2,cx,cy,r);g.addColorStop(0,`rgba(${L},0)`);g.addColorStop(.85,`rgba(${L},${.025+R()*.03})`);g.addColorStop(1,`rgba(${L},0)`);x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
 for(let k=0;k<160;k++){x.fillStyle=`rgba(${L},${R()*.35})`;x.beginPath();x.arc(ox+R()*1080,oy+R()*1350,R()*2.2,0,7);x.fill()}
 const so=[ox+540+(R()-.5)*160,oy+500+(R()-.5)*80];
 const ports=[[ox+540,oy],[ox+540,oy+1350],[ox,oy+560],[ox+1080,oy+560]];
 // axon bundles to fixed ports so every tile connects to its neighbours
 ports.forEach((p,pi)=>{const dir=pi<2?[0,pi==0?-1:1]:[pi==2?-1:1,0];const c2=[p[0]-dir[0]*260,p[1]-dir[1]*260];
  for(let s=0;s<14;s++){const off=(s-6.5)*4.2;const a=[so[0]+(R()-.5)*30,so[1]+(R()-.5)*30];const b=[p[0]+(dir[1]?off:0),p[1]+(dir[0]?off:0)];
   const c1=[so[0]+(R()-.5)*420,so[1]+(R()-.5)*420];const cc=[c2[0]+(dir[1]?off:0)+(R()-.5)*60*(dir[0]?1:0),c2[1]+(dir[0]?off:0)+(R()-.5)*60*(dir[1]?1:0)];
   const pts=path(a,b,c1,cc,24,26);strand(pts,6,.04,L);strand(pts,1.3,.32+R()*.3,s%5==0?'255,255,245':L)}
  // signal sparks travelling along bundle
  for(let s=0;s<5;s++){const t=R();const q=path(so,p,[so[0],so[1]],c2,40,0)[Math.floor(t*40)];const g=x.createRadialGradient(q[0],q[1],0,q[0],q[1],38);g.addColorStop(0,'rgba(255,255,240,.9)');g.addColorStop(.25,`rgba(${L},.5)`);g.addColorStop(1,`rgba(${L},0)`);x.fillStyle=g;x.beginPath();x.arc(q[0],q[1],38,0,7);x.fill()}});
 // dendrites
 for(let k=0;k<11;k++)branch(so[0],so[1],R()*6.28,70+R()*80,3.2,6);
 // soma glow
 [[420,.10],[230,.22],[120,.5],[62,.9]].forEach(([r,a])=>{const g=x.createRadialGradient(so[0],so[1],0,so[0],so[1],r);g.addColorStop(0,`rgba(${r<70?'255,255,235':L},${a})`);g.addColorStop(1,`rgba(${L},0)`);x.fillStyle=g;x.beginPath();x.arc(so[0],so[1],r,0,7);x.fill()});
 // dark fade for headline area
 x.globalCompositeOperation='source-over';const fg=x.createLinearGradient(0,oy+820,0,oy+1350);fg.addColorStop(0,'rgba(3,4,3,0)');fg.addColorStop(.45,'rgba(3,4,3,.82)');fg.addColorStop(1,'rgba(3,4,3,.9)');x.fillStyle=fg;x.fillRect(ox,oy+820,1080,530);x.globalCompositeOperation='lighter';
 x.restore();
 const [a,b,tag]=H[i];document.getElementById('o').insertAdjacentHTML('beforeend',`<div class=t style="left:${ox}px;top:${oy}px"><div style="position:absolute;left:90px;top:80px;font:700 20px C;letter-spacing:6px;color:#f2f2ee">AUTOPILOT.OI</div><div style="position:absolute;right:90px;top:80px;font:400 20px M;letter-spacing:2px;color:#9a9a92">Nº ${String(39-i).padStart(3,'0')}</div><div style="position:absolute;left:0;right:0;top:950px;text-align:center;font:400 104px/.92 A;text-transform:uppercase;color:#f2f2ee">${a}<br><span style="color:#D4FF3A">${b}</span></div><div style="position:absolute;left:0;right:0;top:1226px;text-align:center;font:400 20px M;letter-spacing:5px;color:#77776f">${tag}</div></div>`)}
</script></body></html>
