<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href="/tools/carousel/style.css"><style>
body{margin:0;width:3240px;height:4050px;position:relative;overflow:hidden;background:#f2f2ee}
.row{position:absolute;left:0;width:3240px;height:1350px;overflow:hidden}
.t{position:absolute;top:0;width:1080px;height:1350px;overflow:hidden}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.22)}
.A{position:absolute;font-family:A;text-transform:uppercase;line-height:.9;white-space:nowrap;letter-spacing:-.5px}
.M{position:absolute;font:400 21px M;letter-spacing:5px;text-transform:uppercase;white-space:nowrap}
.O{position:absolute;font-family:A;text-transform:uppercase;line-height:.86;font-style:italic;transform:skewX(-8deg);color:transparent;-webkit-text-stroke:3px #0b0b0b;white-space:nowrap}
.hl{position:absolute;text-align:left}.hl .k{font:400 21px M;letter-spacing:5px;text-transform:uppercase;margin-bottom:18px}
.hl .h{font-family:A;text-transform:uppercase;line-height:.9;white-space:nowrap}
.box{display:inline-block;background:#D4FF3A;color:#0b0b0b;padding:2px 14px 0;margin-left:-14px}
</style></head><body><script>
const INK='#0b0b0b',LIME='#D4FF3A',PAPER='#f2f2ee',BASE=1090,LINE=1196;
const P=n=>`/docs/media/car/photos/${n}/01.jpg`;
const ap=(x,y,w,c='ink',extra='')=>`<img src=ap_${c}.png style="position:absolute;left:${x}px;top:${y}px;width:${w}px;${extra}">`;
const brand=(x,dark)=>ap(x+70,60,58,dark?'paper':'ink')+`<div class=M style="left:${x+144}px;top:64px;color:${dark?PAPER:INK};font-family:C;font-weight:700;letter-spacing:6px">AUTOPILOT.OI</div>`;
const corner=(x,txt,c)=>`<div class=M style="left:${x+1010}px;top:64px;transform:translateX(-100%);color:${c}">${txt}</div>`;
const foot=(x,txt,c,right)=>`<div class=M style="left:${right?x+1010:x+70}px;top:1236px;${right?'transform:translateX(-100%);':''}color:${c}">${txt}</div>`;
// headline block: mono kicker, Anton lines, bottom sits on the shared baseline. accent = lime text on dark, lime box on light
function hl(x,kick,lines,dark,size=112){const c=dark?PAPER:INK;const L=lines.map((t,i)=>i==lines.length-1?(dark?`<span style="color:${LIME}">${t}</span>`:`<span class=box>${t}</span>`):t).join('<br>');
 return `<div class="hl" style="left:${x+70}px;bottom:${1350-BASE}px"><div class=k style="color:${dark?LIME:INK}">${kick}</div><div class=h style="font-size:${size}px;color:${c}">${L}</div></div>`}
// one signal line per row, same height everywhere; colour flips with the background under it
const line=cols=>cols.map((c,i)=>`<div style="position:absolute;left:${i*1080}px;top:${LINE}px;width:1080px;height:6px;background:${c}"></div>`).join('');
// the barcode IS the connector: bars stand on the signal line and run straight through a seam; each bar takes the ink of the post under it
function code(x0,len,seed,cols,label){let s=seed,o='',x=x0;while(x<x0+len){s=(s*9301+49297)%233280;const w=3+Math.floor(s/233280*13);s=(s*9301+49297)%233280;const g=4+Math.floor(s/233280*9);s=(s*9301+49297)%233280;const hh=60+Math.floor(s/233280*3)*14;const tile=Math.floor(x/1080);o+=`<div style="position:absolute;left:${x}px;top:${LINE-hh}px;width:${w}px;height:${hh}px;background:${cols[tile]}"></div>`;x+=w+g}
 const mid=x0+len/2,tile=Math.floor((x0+len+10)/1080);return o+`<div class=M style="left:${x0+len+16}px;top:${LINE-34}px;font-size:16px;color:${cols[tile]}">${label}</div>`}
const pix=(cells,size,col,ox,oy)=>cells.map(([c,r])=>`<div style="position:absolute;left:${ox+c*size}px;top:${oy+r*size}px;width:${size}px;height:${size}px;background:${col}"></div>`).join('');
const seal=(cx,cy,d)=>`<div style="position:absolute;left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:${LIME};box-shadow:0 0 0 6px ${INK}">${ap(d*.2,d*.33,d*.6)}</div>`;
let h='';
// ROW 1  ILLEGAL  (connections: lime shard across seam 1, barcode across seam 2)
h+=`<div class=row style="top:0">
 <div class=t style="left:0;background:${INK}"><div class=ph style="background-image:url(${P('p9')});background-position:50% 35%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82) 78%)"></div>
  ${brand(0,0)}${hl(0,'24 prompts for owners',['Prompts that','should be','illegal.'],1)}${foot(0,'swipe →',PAPER)}</div>
 <div class=t style="left:1080px;background:${PAPER}">${corner(0,'no dm needed',INK)}
  <div class=O style="left:40px;top:150px;font-size:236px">Illegal<br>illegal<br>illegal</div>${foot(0,'link in bio \u2192',INK,1)}
  <div style="position:absolute;left:520px;top:790px;width:490px">${['01 get paid','02 customers','03 sales','04 marketing','05 reviews','06 operations'].map((t,i)=>`<div style="display:flex;justify-content:space-between;border-top:2px solid ${INK};padding:12px 0 10px;font:400 21px M;letter-spacing:4px;text-transform:uppercase;color:${INK}"><span>${t}</span><span>4</span></div>`).join('')}</div></div>
 <div class=t style="left:2160px;background:${INK}">${corner(0,'the store',LIME)}
  ${ap(70,200,520,'lime')}
  <div style="position:absolute;left:640px;top:210px;width:370px">${['price replies','quotes + deposits','follow ups','you hit send'].map((t,i)=>`<div style="border-top:2px solid ${i==3?LIME:'#3a3a3a'};padding:14px 0 12px;font:400 20px M;letter-spacing:4px;text-transform:uppercase;color:${i==3?LIME:PAPER}">${i<3?'\u2713 ':'\u2192 '}${t}</div>`).join('')}</div>
  ${hl(0,'new kit',['Front','desk kit','$39'],1,150)}${foot(0,'link in bio',PAPER,1)}</div>
 <svg style="position:absolute;left:0;top:0" width=3240 height=1350><polygon points="760,1350 1080,640 1400,1350" fill="${LIME}"/></svg>
 ${line([LIME,INK,LIME])}${code(1880,520,11,[LIME,INK,LIME],'AP.OI / KIT 001')}
</div>`;
// ROW 2  CHEATING  (connections: shard from the lime post into the photo, twin vertical words, barcode across seam 1)
h+=`<div class=row style="top:1350px">
 <div class=t style="left:0;background:${PAPER}">${brand(0,0)}
  <svg style="position:absolute;left:0;top:0" width=190 height=1350><defs><pattern id=st width=50 height=50 patternUnits=userSpaceOnUse patternTransform="rotate(45)"><rect width=25 height=50 fill="${INK}"/></pattern></defs><rect width=190 height=1350 fill="url(#st)"/></svg>
  <div class="A" style="left:262px;top:150px;font-size:520px;line-height:.8;color:${INK}">24</div>
  <div class="hl" style="left:262px;bottom:260px"><div class=k style="color:${INK}">for contractors</div><div class=h style="font-size:104px;color:${INK}">Prompts that<br>feel like<br><span class=box>cheating.</span></div></div></div>
 <div class=t style="left:1080px;background:${INK}"><div class=ph style="background-image:url(${P('p4')});background-position:60% 40%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 85%)"></div>
  <div class=M style="left:70px;top:1236px;color:${PAPER}">swap the [brackets]</div></div>
 <div class=t style="left:2160px;background:${LIME}">${corner(0,'try first',INK)}
  <div style="position:absolute;left:70px;top:230px;width:940px;background:${INK};padding:56px 56px 50px;box-sizing:border-box">
   <div class=M style="position:static;color:${LIME};margin-bottom:34px">prompt 01 / quotes</div>
   <div style="font:400 50px/1.32 A;letter-spacing:.5px;color:${PAPER};text-transform:none;white-space:normal">Turn this quote into 3 options, good, better, best, with what changes in each: <span style="color:${LIME}">[paste]</span></div>
   <div style="margin-top:44px;display:flex;align-items:center;gap:16px">${ap(0,0,54,'lime','position:static')}<div class=M style="position:static;color:${PAPER};font-size:17px">copy. paste. send.</div></div>
  </div>
  <div style="position:absolute;left:70px;top:790px;width:940px;border:4px solid ${INK};padding:40px 48px;box-sizing:border-box">
   <div class=M style="position:static;color:${INK};margin-bottom:22px">prompt 02 / money</div>
   <div style="font:400 40px/1.3 A;text-transform:none;color:${INK}">Here are my costs for <span class=box style="margin-left:0;padding:0 8px">[job]</span>. Did I make money? Show the margin in a simple table.</div></div>
  ${foot(0,'all 24 inside',INK,1)}</div>
 <svg style="position:absolute;left:0;top:0" width=3240 height=1350><polygon points="2160,0 1720,0 2160,420" fill="${LIME}"/></svg>
 ${line([INK,LIME,INK])}${code(760,560,23,[INK,LIME,INK],'AP.OI / PACK 024')}
</div>`;
// ROW 3  MONEY  (connections: ap. seal on seam 1, pixel glitch through seam 2 into the face, barcode across seam 2)
h+=`<div class=row style="top:2700px">
 <div class=t style="left:0;background:${LIME}">${brand(0,0)}
  <div style="position:absolute;left:70px;top:150px;width:940px;height:620px;background:url(${P('p5')}) center 30%/cover;filter:grayscale(1) contrast(1.15)"></div>
  ${hl(0,'save this',['6 texts that','get you paid.'],0)}</div>
 <div class=t style="left:1080px;background:${PAPER}">
  <div class=M style="left:70px;top:150px;color:${INK}">for the next</div>
  <div class="A" style="left:66px;top:192px;font-size:180px;color:${INK}">Late<br>invoice.</div>
  <div style="position:absolute;left:70px;top:640px;width:690px">
   <div class=M style="position:static;color:${INK};font-size:17px;margin-bottom:14px">sample / you send it</div>
   <div style="background:${INK};color:${PAPER};border-radius:34px 34px 34px 6px;padding:30px 36px;font:400 30px/1.4 C;text-transform:none;letter-spacing:0">Hi Dana, quick reminder that invoice #1042 for $480 was due Friday. Here's the link to pay. Thanks for your business!</div>
   <div style="margin-top:14px;display:flex;gap:10px;align-items:center">${ap(0,0,40,'ink','position:static')}<div class=M style="position:static;color:${INK};font-size:16px">drafted in your voice</div></div></div>
  ${foot(0,'written nicely',INK)}</div>
 <div class=t style="left:2160px;background:${INK}"><div class=ph style="background-image:url(${P('p11')});background-position:50% 40%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 82%)"></div>
  ${corner(0,'ai news',PAPER)}${hl(0,'one fake interview',['$6.3B gone.'],1,128)}${foot(0,'swipe →',PAPER,1)}</div>
 ${pix([[0,0],[1,0],[3,0],[-1,1],[0,1],[2,1],[3,1],[4,1],[-2,2],[0,2],[1,2],[4,2],[5,2],[-1,3],[1,3],[2,3],[3,3],[5,3],[6,3],[0,4],[3,4],[4,4],[7,4],[2,5],[5,5],[6,5]],60,INK,2040,520)}
 ${pix([[1,0],[4,1],[2,3],[6,2]],60,LIME,2040,520)}
 ${seal(1080,1000,210)}
 ${line([INK,INK,LIME])}${code(1940,470,5,[INK,INK,LIME],'AP.OI / CHASE 006')}
</div>`;
document.body.innerHTML=h;
document.fonts.ready.then(()=>{document.querySelectorAll('.fitb').forEach(e=>{e.style.top=(BASE-e.offsetHeight)+'px'})});
</script></body></html>
