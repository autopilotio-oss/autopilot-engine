<!doctype html><meta charset=utf-8><style>
@font-face{font-family:H;font-weight:900;src:url(f/InterDisplay-Black.otf)}
@font-face{font-family:H;font-weight:800;src:url(f/InterDisplay-ExtraBold.otf)}
@font-face{font-family:I;font-weight:500;src:url(f/Inter-Medium.otf)}
@font-face{font-family:I;font-weight:600;src:url(f/Inter-SemiBold.otf)}
@font-face{font-family:I;font-weight:700;src:url(f/Inter-Bold.otf)}
@font-face{font-family:M;src:url(f/GeistMono-Medium.otf)}
@font-face{font-family:K;src:url(f/BarlowCondensed-BlackItalic.otf)}
:root{--l:#B6F35A;--l2:#D4FF3A}
*{box-sizing:border-box;margin:0;padding:0}body{background:#000}
.k{position:relative;width:1080px;height:1350px;background:#000;color:#fff;font-family:I,sans-serif;overflow:hidden}
/* grain */
.k:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
/* light */
.glow{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
.beam{position:absolute;pointer-events:none;filter:blur(30px)}
.slab{position:absolute;background:linear-gradient(160deg,var(--l2),var(--l) 60%,#7FD13B);pointer-events:none}
/* text system */
.tag{position:absolute;left:80px;top:80px;font:600 24px I;letter-spacing:7px;text-transform:uppercase;line-height:1.5}
.tag:after{content:"";display:block;width:96px;height:6px;background:var(--l);margin-top:16px;border-radius:3px}
.tagr{position:absolute;right:80px;top:84px;font:600 20px I;letter-spacing:5px;text-transform:uppercase;text-align:right;line-height:1.6;color:rgba(255,255,255,.85)}
.h{text-shadow:0 4px 30px rgba(0,0,0,.35);font-family:H;font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.98}
.h em{font-style:normal;color:var(--l)}
.sub{font:500 40px/1.38 I;color:rgba(255,255,255,.78);margin-top:34px}
.sub b{color:#fff;font-weight:700}
.foot{position:absolute;left:80px;right:80px;bottom:70px;display:flex;align-items:flex-end;justify-content:space-between}
.wm{display:flex;align-items:center;gap:16px}
.wm img{width:64px;height:64px;border-radius:50%}
.wm b{font:900 30px H;letter-spacing:5px}
.wm small{display:block;font:600 13px I;letter-spacing:4px;color:var(--l);margin-top:4px}
.stack{font:600 20px I;letter-spacing:7px;text-align:right;line-height:1.75;text-transform:uppercase}
.stack:after{content:"";display:block;width:70px;height:5px;background:var(--l);margin:12px 0 0 auto;border-radius:3px}
.swipe{display:flex;align-items:center;gap:14px;font:700 22px I;letter-spacing:5px}
.swipe i{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font:900 26px H;font-style:normal}
.num{font:900 30px H;color:var(--l);letter-spacing:4px}
/* cards */
.tw{position:absolute;left:80px;right:80px;background:#fff;color:#0f1419;border-radius:44px;padding:52px 56px 40px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.tw .u{display:flex;align-items:center;gap:22px}
.tw .u img{width:100px;height:100px;border-radius:50%}
.tw .n{font:700 38px I}.tw .hd{font:500 30px I;color:#536471}
.tw .tx{font:500 50px/1.3 I;margin:34px 0 28px;letter-spacing:-.5px}
.tw .tm{font:500 28px I;color:#536471;padding-bottom:28px;border-bottom:2px solid #eff3f4}
.tw .ic{display:flex;justify-content:space-around;padding-top:28px}
.tw .ic svg{width:42px;height:42px;stroke:#536471;fill:none;stroke-width:2}
.pc{position:absolute;left:80px;right:80px;background:#0b0c0b;border:2px solid rgba(182,243,90,.45);border-radius:36px;overflow:hidden;box-shadow:0 0 90px rgba(182,243,90,.18)}
.pc .ph{display:flex;align-items:center;gap:14px;padding:26px 36px;border-bottom:2px solid rgba(255,255,255,.08);font:700 22px I;letter-spacing:5px;color:var(--l)}
.pc .ph i{margin-left:auto;font:700 20px I;font-style:normal;color:#000;background:var(--l);border-radius:30px;padding:10px 22px;letter-spacing:3px}
.pc .pt{font:400 36px/1.5 M;color:rgba(255,255,255,.92);padding:36px}
.pill{display:inline-flex;align-items:center;gap:18px;background:var(--l);color:#000;border-radius:60px;padding:26px 44px;font:900 44px H;letter-spacing:1px}
.pill i{width:52px;height:52px;border-radius:50%;background:#000;color:var(--l);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px}
.note{font:400 50px/1.05 K;text-transform:uppercase;transform:rotate(-6deg);display:inline-block}
/* lime theme */
.lime{background:radial-gradient(900px 700px at 70% 30%,#d9ff8f,#B6F35A 55%,#8fd844);color:#000}
.lime .tag:after,.lime .stack:after{background:#000}
.lime .sub{color:rgba(0,0,0,.72)}.lime .sub b{color:#000}
.lime .h em{color:#fff;-webkit-text-stroke:0}
.lime .wm small{color:#000}
.lime .num{color:#000}
.paper{position:absolute;background:#f4f4f1;color:#111;box-shadow:0 30px 60px rgba(0,0,0,.25),inset 0 0 80px rgba(0,0,0,.08);border-radius:6px}
</style><body><div id=w></div>
<script>
const D=__DATA__[__KEY__],L='logo.png';
const foot=(s,dark)=>`<div class=foot><div class=wm><img src="${L}"><div><b>AUTOPILOT.OI</b><small>AI FOR REAL LIFE</small></div></div>${s}</div>`;
const lines=a=>a.map(x=>x.startsWith('*')?`<em>${x.slice(1)}</em>`:x).join('<br>');
const ic=`<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-4-1L3 20l1.2-4.4A8.4 8.4 0 1 1 21 11.5z"/></svg><svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg><svg viewBox="0 0 24 24" style="fill:#f91880;stroke:#f91880"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>`;
let h='';const N=D.slides.length;
D.slides.forEach((s,i)=>{const id=`s${i+1}`,pg=`<span class=num>${String(i+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}</span>`;
 if(s.type=='hook'){h+=`<div class=k id=${id}>
  <div class=beam style="left:430px;top:-200px;width:520px;height:1500px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 80%);transform:rotate(18deg)"></div>
  <div class=glow style="width:900px;height:700px;right:-300px;bottom:-200px;background:rgba(182,243,90,.55)"></div>
  <div class=slab style="width:230px;height:900px;right:-20px;top:640px;transform:skewX(-24deg);opacity:.92"></div>
  <div class=slab style="width:90px;height:700px;right:-140px;top:820px;transform:skewX(-24deg);opacity:.45"></div>
  <div class=tag>${s.tag}</div><div class=tagr>${(s.tr||'').replace(/\|/g,'<br>')}</div>
  <div style="position:absolute;left:80px;right:120px;top:300px"><div class=h style="font-size:${s.size||118}px">${lines(s.h)}</div><div class=sub>${s.s}</div></div>
  ${foot(`<div class=swipe>SWIPE <i>→</i></div>`)}</div>`}
 else if(s.type=='tweet'){h+=`<div class=k id=${id}>
  <div class=glow style="width:1000px;height:900px;left:40px;top:250px;background:rgba(120,210,70,.45)"></div>
  <div class=tag>${s.tag}</div><div class=tagr>${pg}</div>
  <div class=tw style="top:${s.top||330}px"><div class=u><img src="${L}"><div><div class=n>AUTOPILOT.OI</div><div class=hd>@autopilot.oi</div></div></div><div class=tx>${s.t}</div><div class=tm>${s.tm||'Save this for later'}</div><div class=ic>${ic}</div></div>
  ${foot(`<div class=stack>${(s.st||'LEARN|BUILD|AUTOMATE').replace(/\|/g,'<br>')}</div>`)}</div>`}
 else if(s.type=='prompt'){h+=`<div class=k id=${id}>
  <div class=glow style="width:800px;height:600px;left:-200px;top:-200px;background:rgba(182,243,90,.30)"></div>
  <div class=tag>${s.tag}</div><div class=tagr>${pg}</div>
  <div style="position:absolute;left:80px;right:80px;top:270px"><div class=h style="font-size:${s.size||84}px">${lines(s.h)}</div>${s.s?`<div class=sub style="font-size:36px;margin-top:22px">${s.s}</div>`:''}</div>
  <div class=pc style="top:${s.top||640}px"><div class=ph>PASTE THIS INTO CLAUDE<i>COPY</i></div><div class=pt>${s.p}</div></div>
  ${foot('')}</div>`}
 else if(s.type=='lime'){h+=`<div class="k lime" id=${id}>
  <div class=tag>${s.tag}</div><div class=tagr style="color:#000">${pg}</div>
  <div class=paper style="left:80px;top:300px;width:600px;padding:60px 56px;transform:rotate(-4deg)"><div class=h style="font-size:${s.size||96}px;color:#111">${lines(s.h)}</div></div>
  <div style="position:absolute;left:600px;right:70px;top:760px"><span class=note style="font-size:64px">${s.note||''}</span></div>
  <div style="position:absolute;left:80px;right:80px;top:1010px"><div class=sub style="margin:0;font-size:36px">${s.s}</div></div>
  ${foot(`<div class=stack style="color:#000">${(s.st||'FIND|FIX|REPEAT').replace(/\|/g,'<br>')}</div>`)}</div>`}
 else if(s.type=='step'){h+=`<div class=k id=${id}>
  <div class=glow style="width:900px;height:900px;right:-350px;top:200px;background:rgba(182,243,90,.40)"></div>
  <div class=slab style="width:90px;height:1600px;right:110px;top:-100px;transform:skewX(-24deg);opacity:.85"></div>
  <div class=tag>${s.tag}</div><div class=tagr>${pg}</div>
  <div style="position:absolute;left:80px;right:260px;top:360px"><div class=h style="font-size:${s.size||104}px">${lines(s.h)}</div><div class=sub>${s.s}</div></div>
  ${foot('')}</div>`}
 else if(s.type=='cta'){h+=`<div class=k id=${id}>
  <div class=beam style="left:280px;top:-300px;width:520px;height:1300px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 75%);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)"></div>
  <div class=glow style="width:1000px;height:600px;left:40px;bottom:-200px;background:rgba(182,243,90,.55)"></div>
  <div style="position:absolute;left:80px;right:80px;top:300px;text-align:center"><div class=h style="font-size:${s.size||110}px">${lines(s.h)}</div><div class=sub style="margin:34px auto 60px;max-width:820px">${s.s}</div><div class=pill>${s.btn}<i>→</i></div></div>
  ${foot(`<div class=stack>${(s.st||'FOLLOW FOR|DAILY AI|LESSONS').replace(/\|/g,'<br>')}</div>`)}</div>`}
});
document.getElementById('w').innerHTML=h;
</script>
