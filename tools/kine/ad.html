<script>
const D=/*DATA*/null;window.DUR=D.dur;
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};

 if(k==='inbox'){el=$(`<div class="sc"><div class="badge">0</div>${Array.from({length:12},(_,i)=>`<div class="mail" style="top:${230+i*62}px;z-index:${20-i}"><b></b><span>${esc(['Quote request: full detail SUV','Can you do Saturday?','Invoice 1042 reminder','Re: ceramic coating price','Booking change, Thursday','Review request bounced','How much for interior?','New lead from website','Supplier price list','Dave: still thinking','Cancel my 2pm','Minivan interior, kids'][i])}</span></div>`).join('')}</div>`)}

function streak(v){if(v<0||v>.34)return;const k=v/.34;const ax=-260,ay=1560,bx=1340,by=240;const h=ex(k*1.6),tl=ex(cl((k-.25)/.75));const hx=ax+(bx-ax)*h,hy=ay+(by-ay)*h,tx=ax+(bx-ax)*tl,ty=ay+(by-ay)*tl;fx.save();fx.lineCap='round';fx.globalCompositeOperation='lighter';fx.strokeStyle='rgba(212,255,58,.5)';fx.lineWidth=46;fx.shadowColor='#D4FF3A';fx.shadowBlur=60;fx.beginPath();fx.moveTo(tx,ty);fx.lineTo(hx,hy);fx.stroke();fx.shadowBlur=0;fx.strokeStyle='rgba(255,255,240,.95)';fx.lineWidth=12;fx.stroke();fx.restore();if(v<.07){fx.fillStyle=`rgba(238,255,200,${.08*(1-v/.07)})`;fx.fillRect(0,0,1080,1920)}}
