function streak(v){if(v<0||v>.34)return;const k=v/.34;const ax=-260,ay=1560,bx=1340,by=240;const h=ex(k*1.6),tl=ex(cl((k-.25)/.75));const hx=ax+(bx-ax)*h,hy=ay+(by-ay)*h,tx=ax+(bx-ax)*tl,ty=ay+(by-ay)*tl;fx.save();fx.lineCap='round';fx.globalCompositeOperation='lighter';fx.strokeStyle='rgba(212,255,58,.5)';fx.lineWidth=46;fx.shadowColor='#D4FF3A';fx.shadowBlur=60;fx.beginPath();fx.moveTo(tx,ty);fx.lineTo(hx,hy);fx.stroke();fx.shadowBlur=0;fx.strokeStyle='rgba(255,255,240,.95)';fx.lineWidth=12;fx.stroke();fx.restore();if(v<.07){fx.fillStyle=`rgba(238,255,200,${.1*(1-v/.07)})`;fx.fillRect(0,0,1080,1920)}}

function caption(t){const cap=document.getElementById('cap');const c=D.caps.find(c=>t>=c.s&&t<c.e);if(!c){cap.innerHTML='';return}

 cap.innerHTML=main+(keys?`<span class="k">${keys}</span>`:'');const last=on[on.length-1];const v=last?t-last[1]:1;cap.style.transform=`scale(${1+.06*Math.exp(-v*14)})`}
let cur=null;
