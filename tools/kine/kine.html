<!doctype html><html><head><meta charset="utf-8"><title>kine</title><style>

.url{position:absolute;left:60px;right:60px;top:1150px;text-align:center;font:700 54px SM;color:var(--W);border:3px solid var(--L);border-radius:20px;padding:22px 10px;background:rgba(204,255,51,.08);box-shadow:0 0 50px rgba(204,255,51,.25)}
.arw{position:absolute;left:0;right:0;top:1300px;text-align:center;font:700 120px SM;color:var(--L);text-shadow:0 0 40px rgba(204,255,51,.6)}
.cold .tg{position:absolute;left:0;right:0;top:470px;text-align:center}
.cold .big{position:absolute;left:0;right:0;top:560px;text-align:center;font:400 380px/1 BB;color:var(--L);-webkit-text-stroke:5px var(--L);text-shadow:0 0 90px rgba(204,255,51,.5)}
.cold .ln{position:absolute;left:40px;right:40px;text-align:center;font:400 120px/1 BB;color:var(--W);-webkit-text-stroke:3px var(--W);letter-spacing:1px}
#top{position:absolute;left:64px;right:64px;top:118px;display:flex;justify-content:space-between;font:700 30px SM;color:var(--W);letter-spacing:2px}
#top b{color:var(--L)}#top span{color:var(--G)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font:800 64px/1.15 IN;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.9)}

#cap .hi{color:var(--L)}
#vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.65));pointer-events:none}
#fx{position:absolute;inset:0}
</style></head><body><div id="root"><div id="bg"></div><div id="glow"></div><div id="mq"></div><div id="stage"></div><div id="top"><div>AUTOPILOT<b>.OI</b></div><span id="stp"></span></div><div id="cap"></div><div id="vig"></div><canvas id="fx" width="1080" height="1920"></canvas></div>
<script>
const D=/*DATA*/null;window.DUR=D.dur;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),ex=x=>x>=1?1:1-Math.pow(2,-10*cl(x)),bk=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rnd(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
const meas=document.createElement('canvas').getContext('2d');
function fitSize(lines,maxW,maxH,cap){let f=cap;for(const l of lines){meas.font=`400 100px BB`;const w=meas.measureText(l).width/100;f=Math.min(f,maxW/w)}return Math.min(f,maxH/(lines.length*.86))}
// slam-in transform: horizontal stretch + blur + chromatic split decaying over d seconds
function slam(el,u,d=.16,o={}){const k=ex(u/d);const sx=1+(o.sx??.85)*(1-k),sy=1-(o.sy??.25)*(1-k),y=(o.y??40)*(1-k);
 el.style.transform=`translateY(${y}px) scale(${sx},${sy})${o.extra||''}`;el.style.opacity=u<0?0:cl(u/.04);el.style.filter=k<.98?`blur(${(1-k)*12}px)`:'none';
 const c=(1-k)*16;el.style.textShadow=c>.5?`${-c}px 0 rgba(255,40,110,.7),${c}px 0 rgba(0,230,255,.7)${o.glow?','+o.glow:''}`:(o.glow||'')}
const stage=document.getElementById('stage');
function build(sh){const sc=sh.sc||{};let el;
 if(sh.type==='cold'){const p=sh.po;el=$(`<div class="shot cold"><div class="tg"><span class="tag">${esc(p.tag||'sample data')}</span></div><div class="big">${esc(p.big)}</div>${(p.lines||[]).map((l,i)=>`<div class="ln" style="top:${960+i*125}px">${esc(l).replace(/\*([^*]+)\*/g,'<span style="color:var(--L);-webkit-text-stroke-color:var(--L)">$1</span>')}</div>`).join('')}</div>`);
  const big=el.querySelector('.big');meas.font='400 100px BB';big.style.fontSize=Math.min(380,960/(meas.measureText(p.big).width/100))+'px';
  el.querySelectorAll('.ln').forEach(n=>{const f=Math.min(130,960/(meas.measureText(n.textContent).width/100));n.style.fontSize=f+'px'})}
 else if(sh.type==='phrase'){const lines=sh.words.map(w=>w[0]);const f=fitSize(lines,940,820,330);
  el=$(`<div class="shot"><div class="ph">${sh.words.map(w=>`<div class="${w[1]?'L':''}" style="font-size:${f}px;-webkit-text-stroke:${f/60}px ${w[1]?'var(--L)':'var(--W)'}">${esc(w[0])}</div>`).join('')}</div></div>`)}
 else if(sh.type==='ask'){el=$(`<div class="shot"><div class="hd">THE <span class="L">PROMPT:</span></div><div class="panel" style="top:520px"><div class="pbar"><span><b>●</b> CLAUDE · NEW CHAT</span><span>${esc(D.agent)}</span></div>${(sc.files||[]).map(f=>`<div class="file"><i>${esc(f.split('.').pop().toUpperCase())}</i>${esc(f)}</div>`).join('')}<div class="txt"></div><div class="send">↵</div></div></div>`)}
 else if(sh.type==='work'){const n=sc.lines.length,gap=Math.min(170,640/n);el=$(`<div class="shot"><div class="hd">${esc(sc.title)}</div><div class="node">${esc(D.agent)}</div><div class="spine" style="top:640px;height:${(n-.5)*gap+40}px"><i></i></div>${sc.lines.map((l,i)=>`<div class="step" style="top:${700+i*gap}px"><div class="c">✓</div><div class="t">${esc(l)}</div></div>`).join('')}<div class="pct"><span>AGENT AT WORK</span><span class="p">0%</span></div><div class="bar"><i></i></div></div>`);sh.gap=gap}
 else if(sh.type==='table'){const ci=sc.cols.length-1;const m=(sc.foot||'').match(/\$[\d,]+(\.\d+)?/g)||[];sh.big=m.length?m[m.length-1]:'';sh.bigN=parseFloat(sh.big.replace(/[$,]/g,''))||0;
  el=$(`<div class="shot"><div class="hd">${esc(sc.title)}</div>${sc.sample?'<div class="sub"><span class="tag">sample data</span></div>':''}<div class="rows">${sc.rows.map(r=>`<div class="row"><span class="n">${esc(r[0])}</span>${r.length>2?`<span class="m">${esc(r[1])}/mo</span>`:''}<span class="y">${esc(r[ci])}</span></div>`).join('')}</div>${sh.big?`<div class="total"><div class="big">$0</div><div class="lab">${esc(sc.foot.replace(/\s+·\s+/g,' · '))}</div></div>`:''}</div>`)}
 else if(sh.type==='checks'){el=$(`<div class="shot"><div class="hd">${esc(sc.title)}</div><div class="rows" style="top:540px">${sc.rows.map(r=>`<div class="chk"><div class="c ${r[2]?'':'x'}">${r[2]?'✓':'!'}</div><div class="t">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join('')}</div><div class="stamp ${sc.ok?'':'no'}" style="left:70px;right:auto;top:${600+sc.rows.length*150+60}px;font-size:70px">${esc(sc.verdict||'DONE')}</div></div>`)}
 else if(sh.type==='doc'){el=$(`<div class="shot"><div class="hd">${esc(sc.title)}</div>${sc.sub?`<div class="sub">${esc(sc.sub)}</div>`:''}<div class="paper"></div><div class="stamp">READY TO SEND</div></div>`)}
 else if(sh.type==='dm'){el=$(`<div class="shot"><div class="hd">${esc(sc.title)}</div><div class="rows" style="top:540px">${sc.msgs.map(m=>`<div class="bub">${esc(m[1])}</div>`).join('')}</div></div>`)}
 else if(sh.type==='cta'&&sc.url){el=$(`<div class="shot"><div class="cta1" style="top:430px;font-size:150px">${esc(sc.name).toUpperCase()}</div><div class="kw" style="top:640px;font-size:300px">${esc(sc.price)}</div><div class="cta2" style="top:1060px;font-size:34px">${esc(sc.sub||'')}</div><div class="url">${esc(sc.url)}</div><div class="arw">↓</div></div>`)}
 else if(sh.type==='cta'){el=$(`<div class="shot"><div class="cta1">COMMENT</div><div class="kw">${esc(sc.kw)}</div><div class="cta2">${/free/i.test(sc.name)?'':esc(sc.price||'FREE')+' · '}${esc(sc.name)}</div><div class="cta3">${esc(sc.sub||'')}</div><div class="arw">↓</div></div>`)}
 stage.appendChild(el);const hd=el.querySelector('.hd');if(hd){meas.font='400 100px BB';hd.style.fontSize=Math.min(150,930/(meas.measureText(hd.textContent).width/100*1.02))+'px';hd.style.whiteSpace='nowrap'}sh.el=el;return el}
function typed(text,k,hl){const n=Math.floor(text.length*cl(k));let out='',pos=0;text.split(' ').forEach((w,i)=>{const a=pos,b=pos+w.length;pos=b+1;if(a>=n)return;const part=esc(w.slice(0,Math.max(0,n-a)));out+=(i?' ':'')+(hl&&hl[i]&&n>=b?`<span class="hl">${part}</span>`:part)});return out}
function docHTML(text,k){const n=Math.floor(text.length*cl(k));return esc(text.slice(0,n)).replace(/(\$[\d,]+(?:\.\d+)?|U\.S\. DOT rules|full refund)/g,'<span class="hl">$1</span>')}
function upd(sh,t){const u=t-sh.s,L=sh.e-sh.s,el=sh.el,sc=sh.sc||{};const q=s=>el.querySelector(s),qa=s=>[...el.querySelectorAll(s)];
 const hd=q('.hd');if(hd)slam(hd,u,.2,{sx:.6,y:-30});const sub=q('.sub');if(sub){sub.style.opacity=cl((u-.15)/.15)}
 if(sh.type==='cold'){const big=q('.big');const f=(Math.floor(t*30)%2);slam(big,u+.1,.12,{glow:'0 0 90px rgba(204,255,51,.5)'});big.style.transform+=` scale(${1+.025*Math.sin(t*9)*Math.exp(-u*2)+.03*u})`;
  qa('.ln').forEach((n,i)=>slam(n,u+.1-i*.03,.12,{sx:.5}));q('.tg').style.opacity=u>.25?1:(f?1:.3)}
 else if(sh.type==='phrase'){qa('.ph div').forEach((n,i)=>{slam(n,u-i*.035,.15,{sx:.9,glow:n.classList.contains('L')?'0 0 60px rgba(204,255,51,.45)':''});n.style.transform+=` scale(${1+.05*u})`})}
 else if(sh.type==='ask'){const p=q('.panel');slam(p,u-.05,.22,{sx:.12,sy:.06,y:60});p.style.filter='none';
  qa('.file').forEach((f,i)=>{const v=t-sh.files_t[i];f.style.opacity=v<0?0:1;f.style.transform=`translateY(${(1-bk(v/.3))*-50}px)`});
  const k=(t-sh.type_t[0])/(sh.type_t[1]-sh.type_t[0]);q('.txt').innerHTML=typed(sc.text,k,sh.hl)+(t<sh.send_t+.2&&(Math.floor(t*3)%2||k<1)?'<span class="cur"></span>':'');
  const s=q('.send'),v=t-sh.send_t;s.style.transform=`scale(${v<0?.9:1+.25*Math.exp(-v*8)*Math.cos(v*30)})`;s.style.opacity=v<0?.35:1}
 else if(sh.type==='work'){const n=sh.steps.length;q('.node').style.opacity=cl((u-.08)/.12);q('.node').style.transform=`translateX(${(1-ex((u-.08)/.25))*-80}px)`;
  let fill=0;qa('.step').forEach((s,i)=>{const [a,d]=sh.steps[i];s.classList.toggle('on',t>=a);s.classList.toggle('ok',t>=d);s.style.opacity=t<a-.25?.25:1;
   const c=s.querySelector('.c');c.style.transform=t>=d?`scale(${1+.35*Math.exp(-(t-d)*9)})`:t>=a?`rotate(${(t-a)*400}deg)`:'none';c.style.borderTopColor=t>=a&&t<d?'transparent':'';
   s.style.transform=`translateX(${(1-ex((t-a+.25)/.3))*60}px)`;if(t>=a)fill=Math.max(fill,i*sh.gap+cl((t-a)/(d-a))*sh.gap*.5)});
  q('.spine i').style.height=fill+'px';const done=sh.steps.filter(x=>t>=x[1]).length;const pc=Math.round(100*cl((done+(t>=sh.steps[Math.min(done,n-1)][0]?.5:0))/n));q('.p').textContent=pc+'%';q('.bar i').style.width=pc+'%'}
 else if(sh.type==='table'){const rows=qa('.row');rows.forEach((r,i)=>{const v=t-sh.rows_t[i];r.style.opacity=v<0?0:1;r.style.transform=`translateX(${(1-ex(v/.25))*300}px) scaleX(${1+.4*(1-ex(v/.2))})`;r.style.filter=v<.12?`blur(${(1-cl(v/.12))*8}px)`:'none'});
  if(sh.big){const v=t-sh.total_t,rs=q('.rows'),tot=q('.total');const k=eo(v/.35);rs.style.transform=`translateY(${-k*60}px) scale(${1-.3*k})`;rs.style.opacity=1-.86*k;
   tot.style.opacity=v<0?0:1;const big=tot.querySelector('.big');const cnt=sh.bigN*eo(v/.7);big.textContent='$'+Math.floor(cnt).toLocaleString('en-US');slam(big,v,.18,{glow:'0 0 70px rgba(204,255,51,.45)'});big.style.transform+=` scale(${1+.18*Math.exp(-Math.max(0,v-.7)*8)*(v>.7?1:0)})`;
   tot.querySelector('.lab').style.opacity=cl((v-.7)/.2);meas.font='400 100px BB';big.style.fontSize=Math.min(300,940/(meas.measureText(sh.big.split('.')[0]).width/100))+'px'}}
 else if(sh.type==='checks'){qa('.chk').forEach((r,i)=>{const v=t-sh.rows_t[i];r.style.opacity=v<0?.0:1;r.style.transform=`translateX(${(1-ex(v/.25))*-200}px)`;r.querySelector('.c').style.transform=`scale(${v<0?0:bk(v/.3)})`});
  const st=q('.stamp'),v=t-sh.stamp_t;st.style.opacity=v<0?0:1;st.style.transform=`rotate(-4deg) scale(${v<0?2:1+1.2*(1-ex(v/.18))})`}
