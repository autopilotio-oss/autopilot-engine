<style>
:root { --lime: #D4FF3A; --ink: #07090a; --panel: rgba(10,12,12,.86); --line: rgba(212,255,58,.22); --mut: #9aa18f; --red: #ff5a4f; --amber: #ffc94a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #07090a; color: #eef0e6; font-family: "Space Mono", ui-monospace, Menlo, monospace; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.bb { font-family: "Bebas Neue", Impact, sans-serif; letter-spacing: .04em; }
#hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; background: linear-gradient(#07090ae6, #07090a00); }
#hud .brand { display: flex; flex-direction: column; margin-right: 6px; }
#hud .brand b { font-family: "Bebas Neue", Impact, sans-serif; font-size: 26px; line-height: .95; letter-spacing: .05em; }
#hud .brand b i { color: var(--lime); font-style: normal; }
#hud .brand span { font-size: 9.5px; letter-spacing: .26em; color: var(--lime); }
.chip { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; font-size: 10.5px; line-height: 1.25; backdrop-filter: blur(6px); }
.chip em { display: block; font-style: normal; color: var(--mut); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
.chip strong { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 20px; letter-spacing: .03em; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--lime); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
#feeds { display: flex; gap: 6px; flex-wrap: wrap; }
.feed { pointer-events: auto; font-size: 9.5px; padding: 4px 7px; border-radius: 999px; border: 1px solid #2a2f26; background: #0c0e0dcc; color: var(--mut); }
.feed.ok { color: var(--lime); border-color: var(--line); }
.feed.bad { color: var(--red); border-color: #5a2522; }
.feed button { all: unset; cursor: pointer; text-decoration: underline; margin-left: 4px; color: inherit; }
#nav { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 10px calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 6px; overflow-x: auto; background: linear-gradient(#07090a00, #07090ae6); scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#nav button, .btn { flex: none; font: 700 11px/1 "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #eef0e6; background: var(--panel); border: 1px solid #2a2f26; border-radius: 999px; padding: 10px 13px; cursor: pointer; }
#nav button.on { color: var(--ink); background: var(--lime); border-color: var(--lime); }
#nav .sep { flex: none; width: 1px; background: #2a2f26; margin: 4px 2px; }
#panel { position: fixed; right: 10px; top: calc(env(safe-area-inset-top) + 84px); bottom: calc(env(safe-area-inset-bottom) + 64px); width: min(380px, calc(100% - 20px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; overflow: auto; backdrop-filter: blur(10px); }
#panel[hidden], #list[hidden], #modal[hidden] { display: none; }
#panel .x { position: absolute; top: 10px; right: 10px; }
#panel h2 { margin: 0; font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 38px; line-height: .9; letter-spacing: .03em; }
#panel .code { color: var(--lime); font-size: 10px; letter-spacing: .28em; }
#panel .role { color: #cfd3c6; font-size: 12px; margin: 8px 0 12px; }
.state { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.kv { display: grid; grid-template-columns: 7.4rem 1fr; gap: 6px 10px; font-size: 11.5px; margin: 14px 0; }
.kv dt { color: var(--mut); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.orders { font-size: 11px; color: #c8ccbf; background: #0b0d0c; border: 1px solid #1f231d; border-radius: 10px; padding: 10px; max-height: 160px; overflow: auto; white-space: pre-wrap; line-height: 1.45; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn.lime { background: var(--lime); color: var(--ink); border-color: var(--lime); }
.btn.red { border-color: #5a2522; color: var(--red); }
.btn[disabled] { opacity: .45; cursor: default; }
.note { font-size: 10px; color: var(--mut); margin-top: 10px; line-height: 1.5; }
#list { position: fixed; inset: calc(env(safe-area-inset-top) + 84px) 10px calc(env(safe-area-inset-bottom) + 64px); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; overflow: auto; backdrop-filter: blur(10px); }
#list table { width: 100%; border-collapse: collapse; font-size: 11px; }
#list th { text-align: left; color: var(--mut); font-weight: 400; padding: 6px; border-bottom: 1px solid #23271f; }
#list td { padding: 8px 6px; border-bottom: 1px solid #191c17; vertical-align: top; }
#list tr { cursor: pointer; }
#modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 9; padding: 20px; }
#modal .box { max-width: 360px; background: #0c0e0d; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
#modal p { font-size: 12.5px; line-height: 1.5; margin: 0 0 6px; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; font-size: 11.5px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
#toast.on { opacity: 1; }
#sim { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-12deg); font: 400 64px/1 "Bebas Neue", Impact, sans-serif; color: #ff5a4f55; pointer-events: none; letter-spacing: .1em; }
#legend { position: fixed; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 62px); font-size: 9.5px; color: var(--mut); display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
#legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--c); }
@media (max-width: 640px) { #hud .chip.opt { display: none; } #hud .brand b { font-size: 22px; } }
</style>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Config: agent identities. Matched to real scheduled tasks by name. Anything
// that does not match still gets a desk, so no agent is ever dropped.
// ---------------------------------------------------------------------------
const SIM = location.hash === '#demo';
const SERVERS = { remote: 'Claude Code Remote', metricool: 'Metricool Social Media Management', kit: 'Kit' };
const ROSTER = [
  { re: /news desk/i, code: 'WIRE', dept: 'content', role: 'Breaks big AI and money news first as fact checked carousels.', vibe: 'Restless, always scanning headlines.', hue: 0x111214 },
  { re: /operator/i, code: 'FOREMAN', dept: 'exec', role: 'Runs FIRST SALES MODE each morning: factory reels, funnels, ads, scoreboard.', vibe: 'Calm, decisive, owns the plan.', hue: 0x0e0f10 },
  { re: /support|inbox/i, code: 'SHIELD', dept: 'care', role: 'Reads the inbox, drafts replies, opens incidents. Never sends on its own.', vibe: 'Patient and careful.', hue: 0x141517 },
  { re: /monthly|scale review/i, code: 'LEDGER', dept: 'finance', role: 'Monthly scale review: finances, portfolio, next month priorities.', vibe: 'Quiet, counts everything twice.', hue: 0x101113 },
  { re: /final report/i, code: 'CLOSER', dept: 'exec', role: 'Writes the FIRST SALES MODE final report on Nov 11.', vibe: 'Waits for the numbers, then talks.', hue: 0x0f1012 },
  { re: /test result|reel test/i, code: 'JUDGE', dept: 'finance', role: 'Reads the factory reel test results and gives the verdict.', vibe: 'Blunt, data first.', hue: 0x131416 },
  { re: /pulse/i, code: 'PULSE', dept: 'systems', role: 'Daily Pulse: health, unapproved post guard, daily report.', vibe: 'Never misses a heartbeat.', hue: 0x111215 },
  { re: /sprint|weekly/i, code: 'COACH', dept: 'finance', role: 'Weekly sprint: picks the one experiment and the weekly report.', vibe: 'Pushes the team, keeps score.', hue: 0x121315 },
  { re: /newsletter/i, code: 'INK', dept: 'content', role: 'Writes the newsletter from what worked this week.', vibe: 'Wordsmith, hates fluff.', hue: 0x131315 },
  { re: /tiktok|intel|trend|scout|viral/i, code: 'SCOUT', dept: 'content', role: 'Finds proven formats and trends before anyone else.', vibe: 'Curious, always on the phone.', hue: 0x151618 },
];
const GH_WORKERS = [ // GitHub Actions workers: real, but no live feed reaches this page yet.
  { code: 'HEALTH', name: 'Growth OS health checks', dept: 'systems', role: 'Hourly site, checkout and page checks (GitHub Actions).' },
  { code: 'TILL', name: 'Revenue ledger', dept: 'finance', role: 'Gumroad and site numbers into the ledger (GitHub Actions).' },
  { code: 'POSTMAN', name: 'Kit sync', dept: 'systems', role: 'Routes subscribers into Kit every 3 hours (GitHub Actions).' },
];
const DEPTS = {
  exec: { name: 'Executive', x: 0, z: -7.5 },
  content: { name: 'Content + Research', x: -11, z: 3 },
  care: { name: 'Customer Support', x: 11, z: 3 },
  finance: { name: 'Finance + Analytics', x: 11, z: -6 },
  systems: { name: 'Systems + Automation', x: -11, z: -6 },
};
const STATE = {
  WORKING: { c: '#D4FF3A', label: 'WORKING' }, COMPLETED: { c: '#7fd6ff', label: 'COMPLETED' }, IDLE: { c: '#9aa18f', label: 'IDLE' },
  FAILED: { c: '#ff5a4f', label: 'FAILED' }, OFFLINE: { c: '#666', label: 'PAUSED' }, NOFEED: { c: '#4a4d45', label: 'NO LIVE FEED' }, WAITING: { c: '#4a4d45', label: 'WAITING FOR FEED' },
};

// ---------------------------------------------------------------------------
// Renderer, scene, camera
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { renderer = null; }
const ui = { list: document.getElementById('list'), panel: document.getElementById('panel'), toast: document.getElementById('toast') };
if (!renderer) { ui.list.hidden = false; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.3, 1200);
if (renderer) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer && renderer.setSize(innerWidth, innerHeight, false); });

// ---------------------------------------------------------------------------
// Procedural textures
// ---------------------------------------------------------------------------
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function brick(g, w, h, base) {
  g.fillStyle = '#2a201b'; g.fillRect(0, 0, w, h);
  const bh = 8, bw = 22;
  for (let y = 0, r = 0; y < h; y += bh, r++) for (let x = -(r % 2) * bw / 2; x < w; x += bw) {
    const k = 0.75 + rnd() * 0.4; const c = base.map((v) => Math.min(255, v * k | 0));
    g.fillStyle = `rgb(${c})`; g.fillRect(x + 1, y + 1, bw - 2, bh - 2);
  }
  g.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 0; i < 40; i++) g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 30, 1 + rnd() * 3);
}
const brickTex = (base, rx, ry) => canvasTex(256, 256, (g, w, h) => brick(g, w, h, base), [rx, ry]);
// building facade with windows; emissive map lights random windows at night
function facade(cols, rows, base, storefront) {
  const W = 512, H = 512; const lit = [];
  const color = canvasTex(W, H, (g) => {
    brick(g, W, H, base);
    const mw = W / cols, mh = H / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (storefront && r === rows - 1) continue;
      const x = c * mw + mw * 0.22, y = r * mh + mh * 0.2, ww = mw * 0.56, hh = mh * 0.58;
      g.fillStyle = '#d8d2c4'; g.fillRect(x - 3, y + hh, ww + 6, 4);
      g.fillStyle = '#10161c'; g.fillRect(x, y, ww, hh);
      g.fillStyle = 'rgba(160,180,200,.18)'; g.fillRect(x + 2, y + 2, ww / 2 - 3, hh - 4);
      g.strokeStyle = '#1b1b1b'; g.lineWidth = 3; g.strokeRect(x, y, ww, hh); g.beginPath(); g.moveTo(x, y + hh / 2); g.lineTo(x + ww, y + hh / 2); g.stroke();
      if (rnd() < 0.45) lit.push([x, y, ww, hh]);
    }
    if (storefront) {
      const y = (rows - 1) * mh + mh * 0.12;
      g.fillStyle = '#0d1114'; g.fillRect(W * 0.06, y, W * 0.88, mh * 0.82);
      g.fillStyle = '#3a2a1c'; g.fillRect(W * 0.04, y - 16, W * 0.92, 18);
      g.fillStyle = '#e8d9b0'; g.font = 'bold 15px "Space Mono", monospace'; g.fillText(storefront, W * 0.07, y - 3);
    }
  });
  const emis = canvasTex(W, H, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    for (const [x, y, ww, hh] of lit) { g.fillStyle = rnd() < 0.7 ? '#ffcf8a' : '#cfe6ff'; g.fillRect(x + 2, y + 2, ww - 4, hh - 4); }
    if (storefront) { const mh = H / rows; g.fillStyle = '#ffd9a0'; g.fillRect(W * 0.07, (rows - 1) * mh + mh * 0.16, W * 0.86, mh * 0.74); }
  });
  return { color, emis };
}

// ---------------------------------------------------------------------------
// Materials and lights
// ---------------------------------------------------------------------------
const M = {
  concrete: new THREE.MeshStandardMaterial({ color: 0x55534f, roughness: 0.95, map: canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#7b7873'; g.fillRect(0, 0, w, h); for (let i = 0; i < 1600; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.08})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); } g.strokeStyle = 'rgba(0,0,0,.25)'; for (let i = 0; i <= w; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); } }, [16, 16]) }),
  floor: new THREE.MeshStandardMaterial({ color: 0x3b3a38, roughness: 0.55, metalness: 0.1, map: canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#5c5a56'; g.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.12})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, rnd() * 9, 0, 7); g.fill(); } }, [6, 4]) }),
  asphalt: new THREE.MeshStandardMaterial({ color: 0x2b2c2e, roughness: 0.92 }),
  sidewalk: new THREE.MeshStandardMaterial({ color: 0x7c7a75, roughness: 0.9 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x5c6b62, roughness: 0.65, metalness: 0.45 }),
  rust: new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: 0.85, metalness: 0.3 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x121314, roughness: 0.6, metalness: 0.4 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x9fb4c4, roughness: 0.08, metalness: 0, transmission: 0.0, transparent: true, opacity: 0.16 }),
  desk: new THREE.MeshStandardMaterial({ color: 0x1a1a1b, roughness: 0.5, metalness: 0.2 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x3a2c22, roughness: 0.7 }),
  chair: new THREE.MeshStandardMaterial({ color: 0x0e0e0f, roughness: 0.7 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x0d0d0e, roughness: 0.35, metalness: 0.1 }),
  plant: new THREE.MeshStandardMaterial({ color: 0x2f5a2a, roughness: 0.8 }),
  pot: new THREE.MeshStandardMaterial({ color: 0x8a8580, roughness: 0.9 }),
  duct: new THREE.MeshStandardMaterial({ color: 0x6c6f72, roughness: 0.4, metalness: 0.8 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xfff1d0, emissive: 0xffd28a, emissiveIntensity: 2 }),
  lampShade: new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.4, metalness: 0.6, side: THREE.DoubleSide }),
  car: [0x1e2a35, 0x5b1d1d, 0x2c2c2c, 0x6c6f73, 0x203b2a].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: 0.6 })),
  train: new THREE.MeshStandardMaterial({ color: 0xb9bec2, roughness: 0.3, metalness: 0.85 }),
  trainWin: new THREE.MeshStandardMaterial({ color: 0x1b2229, emissive: 0xffe2a8, emissiveIntensity: 0 }),
};
const hemi = new THREE.HemisphereLight(0xb8c4d0, 0x3a352f, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(-60, 80, 50); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 260 });
scene.add(sun);
const interior = []; // warm pendant lights inside the HQ
const streetLights = [];
const nightEmissive = []; // materials whose emissive turns on at night

// ---------------------------------------------------------------------------
// Builders
// ---------------------------------------------------------------------------
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene, shadow = false) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m); return m;
};
const cyl = (rt, rb, h, mat, x = 0, y = 0, z = 0, parent = scene, seg = 12) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); parent.add(m); return m; };

// ground, street, sidewalks
const ground = box(900, 0.2, 900, M.concrete, 0, -0.1, 0); ground.receiveShadow = true;
box(900, 0.06, 13, M.asphalt, 0, 0.02, 24).receiveShadow = true;
for (let x = -440; x < 440; x += 6) box(2.4, 0.07, 0.18, new THREE.MeshBasicMaterial({ color: 0xc9b26a }), x, 0.06, 24);
box(900, 0.22, 5, M.sidewalk, 0, 0.1, 15.5).receiveShadow = true;
box(900, 0.22, 5, M.sidewalk, 0, 0.1, 32.5).receiveShadow = true;

// ---- the HQ: converted brick warehouse, cutaway (no roof) so you can see in
const HQ = new THREE.Group(); scene.add(HQ);
const hqW = 40, hqD = 26, hqH = 9.5;
const wallBrick = new THREE.MeshStandardMaterial({ map: brickTex([120, 62, 46], 6, 3), roughness: 0.9 });
const wallBrickIn = new THREE.MeshStandardMaterial({ map: brickTex([96, 52, 40], 6, 3), roughness: 0.95 });
box(hqW, 0.25, hqD, M.floor, 0, 0.12, 0, HQ).receiveShadow = true;
box(hqW, hqH, 0.6, wallBrickIn, 0, hqH / 2, -hqD / 2, HQ, true); // back wall
[-1, 1].forEach((s) => box(0.6, hqH, hqD, wallBrickIn, s * hqW / 2, hqH / 2, 0, HQ, true)); // side walls

// Loop
// ---------------------------------------------------------------------------
