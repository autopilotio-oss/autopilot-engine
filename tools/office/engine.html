  else if(a.mode==='idle'){a.arms.forEach((m,i)=>m.rotation.x=Math.sin(t*1.2+i+s)*.08);a.head.rotation.y=Math.sin(t*.6+s)*.4;a.g.position.y=.4+Math.sin(t*2+s)*.02}
  else if(a.mode==='walk'){const sg=SEGS[a.si];const ph=((t*.09+a.off)%2);const fw=ph<1;const u=fw?ph:2-ph;const ee=u;tmp.lerpVectors(sg[0],sg[1],.08+.84*ee);a.g.position.set(tmp.x,.4,tmp.z);const dx=sg[1].x-sg[0].x,dz=sg[1].z-sg[0].z;a.g.rotation.y=Math.atan2(fw?dx:-dx,fw?dz:-dz);
   const w=t*9+a.off*5;a.legs.forEach((l,i)=>l.rotation.x=Math.sin(w+i*Math.PI)*.55);a.arms.forEach((m,i)=>m.rotation.x=-.9);a.g.position.y=.34+Math.abs(Math.sin(w))*.06}}
 // tags & icons
 const tagA=cl((34-c.h)/8);

  const ph=((t+g.a.seed*1.3)%4.2)/4.2;const ic=ph<.62?(ph<.3?ICON.warn:ICON.dots):ICON.ok;if(g.ic.material.map!==ic){g.ic.material.map=ic;g.ic.material.needsUpdate=true}
  const pop=ph<.62?((ph%.31)/.31):(ph-.62)/.38;const sc=.62*(1+.25*Math.max(0,1-pop*6));g.ic.scale.set(sc,sc,1);g.ic.position.set(tmp.x,tmp.y+g.h+.62,tmp.z);g.ic.material.opacity=tagA}
 // orbs

 // owner stamp
 {const o=R.owner;const cc=center('owner');const ph=(t%3.0)/3.0;const yes=Math.floor(t/3.0)%3!==1;const sp=yes?o.stamp:o.nope,ot=yes?o.nope:o.stamp;ot.material.opacity=0;
  const a=ph<.15?ph/.15:ph<.8?1:1-(ph-.8)/.2;const sc=.8*(1+.3*Math.max(0,1-ph/.12));sp.scale.set((yes?3.2:3.6)*sc,(yes?.8:.9)*sc,1);sp.position.set(cc.x+2.6,2.6,cc.z+1.4);sp.material.opacity=a*cl((40-c.h)/10)}
