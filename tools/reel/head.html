<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(SairaSemiCondensed-BlackItalic.otf)}
@font-face{font-family:SA;src:url(SairaSemiCondensed-BlackItalic.otf)}
@font-face{font-family:GE;font-weight:500 600;src:url(Geist-SemiBold.otf)}
@font-face{font-family:GE;font-weight:700 900;src:url(Geist-Bold.otf)}
@font-face{font-family:M;src:url(GeistMono-Medium.otf)}
:root{--l:#D4FF3A;--d:#06120a}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:GE,sans-serif;font-weight:700;color:#F4F4F0}
#R{position:relative;width:1080px;height:1920px;overflow:hidden;background:#030403}
/* atmosphere */
.blob{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
#b1{width:900px;height:900px;background:rgba(212,255,58,.16)}
#b2{width:800px;height:700px;background:rgba(40,120,90,.18)}
#streak{position:absolute;left:-40%;width:180%;height:3px;background:linear-gradient(90deg,transparent,rgba(212,255,58,.0),rgba(230,255,160,.9),rgba(212,255,58,.0),transparent);filter:blur(1.5px);opacity:0}
#grain{position:absolute;inset:0;background-size:540px 540px;mix-blend-mode:overlay;opacity:.13;pointer-events:none;z-index:50}
#vig{position:absolute;inset:0;background:radial-gradient(120% 85% at 50% 48%,transparent 52%,rgba(0,0,0,.75) 100%);pointer-events:none;z-index:49}
#flash{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 35%,rgba(225,255,150,.55),transparent 70%);opacity:0;pointer-events:none;z-index:48;mix-blend-mode:screen}
#cam{position:absolute;inset:0;transform-origin:50% 40%}
/* chrome */
#prog{position:absolute;left:44px;right:44px;top:44px;height:10px;display:flex;gap:8px;z-index:60}
#prog .seg{flex:1;height:100%;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
#prog .seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#9fd61a,#D4FF3A 70%,#f2ffc4);box-shadow:0 0 18px rgba(212,255,58,.8);border-radius:6px}
.top{position:absolute;left:44px;right:44px;top:78px;display:flex;align-items:center;gap:16px;z-index:60}
.top img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 30px rgba(212,255,58,.35)}
.top .nm{font:26px SA;letter-spacing:1px;text-transform:uppercase}
#sec{margin-left:auto;font:22px SA;letter-spacing:1px;color:#0a0a0a;background:var(--l);padding:6px 16px 4px;border-radius:10px;text-transform:uppercase;box-shadow:0 0 30px rgba(212,255,58,.4)}
#left{font:500 20px M;color:rgba(255,255,255,.55);letter-spacing:2px}
/* captions */
#cap{position:absolute;left:60px;right:60px;bottom:575px;font-family:SA;font-size:86px;line-height:.96;letter-spacing:.5px;text-transform:uppercase;z-index:40}
#cap span{display:inline-block;margin-right:20px;will-change:transform,filter;text-shadow:0 8px 34px rgba(0,0,0,.75)}
#cap .em{color:var(--l);text-shadow:0 0 40px rgba(212,255,58,.55),0 8px 34px rgba(0,0,0,.7)}
#cap .past{color:#e9ebe4}
/* scenes */
.sc{position:absolute;left:0;right:0;top:250px;height:780px;opacity:0;perspective:1400px}
.mono{font:500 20px M;letter-spacing:3px}
.card{position:relative;background:linear-gradient(165deg,rgba(32,36,30,.92),rgba(10,11,10,.94));border:1.5px solid rgba(255,255,255,.09);border-radius:34px;box-shadow:0 40px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.card:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(140deg,rgba(212,255,58,.55),transparent 35%,transparent 70%,rgba(212,255,58,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card:after{content:'';position:absolute;top:-20%;bottom:-20%;width:38%;left:var(--sh,-60%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);transform:skewX(-18deg);pointer-events:none}
.lit{border-color:rgba(212,255,58,.55)!important;box-shadow:0 0 70px rgba(212,255,58,.22),0 40px 90px rgba(0,0,0,.6)}
.chip{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 24px;font:500 20px M;letter-spacing:3px;border:1.5px solid rgba(212,255,58,.45);color:var(--l);background:rgba(212,255,58,.07)}
.chip.on{background:var(--l);color:var(--d);box-shadow:0 0 44px rgba(212,255,58,.55)}
.sticker{font-family:SA;line-height:.92;letter-spacing:0;text-transform:uppercase}
.big{font-family:SA;line-height:.9;letter-spacing:-1px}
.ico{width:58px;height:58px;border-radius:16px;background:rgba(212,255,58,.1);border:1px solid rgba(212,255,58,.35);display:grid;place-items:center;flex:none}
.row{display:flex;align-items:center;gap:20px;padding:10px 26px;border-top:1px solid rgba(255,255,255,.06);font-size:30px;font-weight:700}
.msg{border-radius:26px;padding:24px 28px;font-size:32px;line-height:1.35}
.tagn{display:inline-flex;align-items:center;gap:12px;background:var(--l);color:var(--d);border-radius:12px;padding:8px 16px;font:500 20px M;letter-spacing:3px}
.redx{position:absolute;left:-4%;right:-4%;top:46%;height:12px;background:linear-gradient(90deg,#ff3b3b,#ff7a5a);border-radius:6px;transform-origin:left;box-shadow:0 0 30px rgba(255,70,70,.8)}
.flag{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:7px 13px 5px;font:20px SA;letter-spacing:1px;text-transform:uppercase;background:#ff4d4d;color:#160404;box-shadow:0 0 24px rgba(255,77,77,.45)}
.flag.ok{background:var(--l);color:var(--d)}
.ln{height:14px;border-radius:7px;background:rgba(255,255,255,.12);margin:14px 0}
.note{font:500 15px M;letter-spacing:3px;color:rgba(212,255,58,.55);border:1px solid rgba(212,255,58,.3);border-radius:8px;padding:4px 10px}
.barw{height:36px;border-radius:12px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}.barw i{display:block;height:100%;background:linear-gradient(90deg,#9fd61a,#D4FF3A);box-shadow:0 0 22px rgba(212,255,58,.5);border-radius:12px}
.dim{color:#8a8d86}
/* presenter */
#pres{mix-blend-mode:lighten;position:absolute;left:180px;top:1260px;width:720px;height:660px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(transparent,#000 6%);-webkit-mask-composite:source-in;mask-composite:intersect}
#pf{position:absolute;left:0;top:-60px;width:720px;height:1280px}
#scr{position:absolute;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#17191a,#050606 62%)}
#glow{position:absolute;left:190px;top:1240px;width:700px;height:520px;border-radius:50%;background:rgba(212,255,58,.14);filter:blur(90px)}
#floor{position:absolute;left:0;right:0;top:1820px;height:100px;background:linear-gradient(transparent,rgba(212,255,58,.06));}
</style></head><body><div id="R">
<div class="blob" id="b1"></div><div class="blob" id="b2"></div><div id="streak"></div>
<div id="prog"></div>
<div class="top"><img src="logo.png"><span class="nm">AUTOPILOT.OI</span><span id="left"></span><span id="sec"></span></div>
<div id="cam">
<div id="cap"></div>
