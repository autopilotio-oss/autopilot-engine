<script>
(function(){
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eout=u=>1-Math.pow(1-cl(u),3);const back=u=>{u=cl(u);const c=1.7;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};
const typed=(s,p)=>s.slice(0,Math.floor(s.length*cl(p)));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hhmmss=s=>[Math.floor(s/3600)%24,Math.floor(s/60)%60,Math.floor(s)%60].map(v=>String(v).padStart(2,'0')).join(':');
const hsh=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const rise=(a,d=24)=>`opacity:${cl(a)};transform:translateY(${(1-eout(a))*d}px)`;
function scr(sc,p,t){
 if(sc.type==='ask'){let h='';const tp=sc.files?.3:.06;if(!sc.files){const a=cl(p*6);h+=`<div class="lbl">${esc(window.DATA.agent.toUpperCase())}</div><div style="${rise(a,20)}"><div class="hi1">${esc(sc.by==='schedule'?'Running on schedule. Starting your task now.':'Hey, I\'m your '+window.DATA.agent+'. What should we work on?')}</div></div>`}
  if(sc.files){h+=`<div class="lbl">${sc.by==='schedule'?'SCHEDULED RUN':'UPLOADED'}</div><div class="files">`+sc.files.map((f,i)=>{const a=cl((p-.02-i*.07)/.08);const up=cl((p-.04-i*.07)/.14);
   return`<div class="file" style="${rise(a)}"><s>${f.split('.').pop().toUpperCase()}</s>${esc(f)}${up>=1?'<em>✓</em>':`<span class="pb"><i style="width:${up*100}%"></i></span>`}</div>`}).join('')+`</div>`}
  const tP=(p-tp)/.42,sent=p>tp+.47;
  if(sent){const a=cl((p-tp-.47)/.06);h+=`<div class="chat"><div style="display:flex;${rise(a,30)}"><div class="bub">${esc(sc.text)}</div></div>`+(p>tp+.55?`<div class="think"><span>agent is working</span><b style="background-position:${-(t*160)%200}% 0"></b></div>`:'')+`</div>`}
  else{const press=cl((p-tp-.44)/.03);h+=`<div class="chat"><div class="lbl">${sc.by==='schedule'?'TASK':'YOU'}</div><div class="inp"><span class="tx">${esc(typed(sc.text,tP))}<span class="cur" style="opacity:${Math.floor(t*2.6)%2?1:.15}"></span></span><span class="go" style="transform:scale(${1-.12*Math.sin(Math.PI*press)})">↑</span></div></div>`}
  return h}
 if(sc.type==='work'){const n=sc.lines.length;let h=`<div class="ttl" style="${rise(cl(p*8))}">${esc(sc.title)}</div><div class="sub" style="${rise(cl(p*8-.3))}">AGENT AT WORK</div>`;
  h+=sc.lines.map((l,i)=>{const a0=i/(n+.6)*.92+.04;const a=cl((p-a0)*7);const done=p>a0+.8/(n+.6);const pop=done?back(cl((p-a0-.8/(n+.6))*9)):1;
   return`<div class="ln" style="${rise(a,30)}"><span class="stt ${done?'ok':'go'}" style="${done?`transform:scale(${pop})`:`transform:rotate(${t*420}deg)`}">${done?'✓':''}</span>${esc(l)}${!done&&a>0?`<span class="sh" style="transform:translateX(${((t*1.6)%1)*200-100}%)"></span>`:''}</div>`}).join('');return h}
 if(sc.type==='table'){const n=sc.rows.length;let h=`${sc.sample?'<span class="smp">SAMPLE DATA</span>':''}<div class="ttl" style="${rise(cl(p*8))}">${esc(sc.title)}</div><table><tr>${sc.cols.map(c=>`<th>${esc(c.toUpperCase())}</th>`).join('')}</tr>`;
  h+=sc.rows.map((r,i)=>{const a=cl((p-.06-i*.5/n)*9);return`<tr style="opacity:${a};transform:translateX(${(1-eout(a))*-30}px)">${r.map((c,j)=>`<td class="${j===r.length-1?'hi':''}">${esc(c)}</td>`).join('')}</tr>`}).join('')+`</table>`;
  if(sc.foot){const a=cl((p-.62)*7);h+=`<div class="foot" style="opacity:${a};transform:scale(${.9+.1*back(a)})">${esc(sc.foot)}</div>`}return h}
 if(sc.type==='checks'){const n=sc.rows.length;let h=`<div class="ttl" style="${rise(cl(p*8))}">${esc(sc.title)}</div><div class="sub" style="${rise(cl(p*8-.3))}">CHECKED JUST NOW</div>`;
  h+=sc.rows.map((r,i)=>{const a=cl((p-.06-i*.5/n)*9);const pop=back(cl((p-.1-i*.5/n)*8));return`<div class="ck" style="${rise(a,20)}"><span>${esc(r[0])}</span><b class="${r[2]?'y':'n'}" style="transform:scale(${pop})">${esc(r[1])}</b></div>`}).join('');
  const a=cl((p-.62)*7);h+=`<div class="vd" style="opacity:${a};transform:scale(${1.18-.18*eout(a)});background:${sc.ok?'#D4FF3A':'#ff4a4a'};color:${sc.ok?'#061006':'#fff'}">${esc(sc.verdict)}</div>`;return h}
 if(sc.type==='doc'){return`${sc.sample!==false?'<span class="smp">SAMPLE</span>':''}<div class="ttl">${esc(sc.title)}</div><div class="sub">${esc((sc.sub||'').toUpperCase())}</div><div class="doc">${esc(typed(sc.text,p*1.25))}<span style="display:inline-block;width:3px;height:26px;background:#D4FF3A;vertical-align:middle;opacity:${p<.8?1:0}"></span></div>`}
 if(sc.type==='dm'){let h=`<div class="ttl">${esc(sc.title)}</div><div class="dm">`;const n=sc.msgs.length;
  h+=sc.msgs.map((m,i)=>{const a=cl((p-i*.7/n)*7);return`<p class="${m[0]}" style="opacity:${a};transform:scale(${.85+.15*back(a)})">${esc(m[1])}</p>`}).join('');return h+'</div>'}
 if(sc.type==='cta'){const a=eout(cl(p*2.6));const ry=-16+10*Math.sin(t*1.1),rx=5+3*Math.sin(t*.8);
  const card=sc.product?`<img class="pimg" src="/docs/store/${sc.cover}-thumb.png" style="transform:perspective(900px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${.85+.15*back(cl(p*2.6))})">`:`<div class="gcard" style="transform:perspective(900px) rotateY(${ry}deg) rotateX(${rx}deg)"><span class="k">FREE GUIDE</span><div class="g">${esc(sc.topic||sc.name)}<em>WITH CLAUDE</em></div><div class="m"><b>AUTOPILOT.OI</b><br>STEP BY STEP</div></div>`;
  const kw=sc.kw?`COMMENT “${esc(sc.kw)}”`:'LINK IN BIO';const pulse=1+.04*Math.max(0,Math.sin(t*5));
  return`<div class="cta" style="opacity:${a};transform:translateY(${(1-a)*30}px)">${card}<div><span class="pr">${esc(sc.price)}</span><div class="nm">${esc(sc.name)}</div><div class="sb">${esc(sc.sub)}</div><span class="kw" style="transform:scale(${pulse})">${kw} <span style="font-size:24px">↗</span></span><span class="ur">${esc(sc.kw?'or tap the link in bio':(sc.url||'autopilotoi.app'))}</span></div></div>`}
 return''}

window.reelDom=function(t){const D=window.DATA;const B=D.beats;
 if(!built){built=true;const hk=document.getElementById('hook');
